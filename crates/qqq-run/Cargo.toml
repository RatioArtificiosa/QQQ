[package]
name = "qqq-run"
description = "The qqqai CLI: new, build, run, dev, serve, test, inspect, audit, why, doctor, schema and mcp. Every command emits stable machine-readable JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "cli", "runtime", "wasm"]
categories = ["wasm", "command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "qqqai"
path = "src/main.rs"

[dependencies]
qqq-core = { path = "../qqq-core", version = "0.0.0" }
qqq-cap = { path = "../qqq-cap", version = "0.0.0" }
qqq-pkg = { path = "../qqq-pkg", version = "0.0.0" }
sha2 = { workspace = true }
qqq-host = { path = "../qqq-host", version = "0.0.0" }
qqq-abi = { path = "../qqq-abi", version = "0.0.0" }
# The edge that makes `[server]` reachable.
#
# `qqq-cap` models the manifest's route table and `qqq-serve` owns the router, and
# neither may depend on the other: in §4.3's topological order `qqq-cap` sits above
# `qqq-serve`, so an edge in either direction points upward and
# `tools/check_topology.py` rejects it. `qqq-run` is above both, which makes it the
# only place in this workspace where a manifest can be turned into a router -- and the
# right place, because converting intent into a running server is orchestration.
qqq-serve = { path = "../qqq-serve", version = "0.0.0" }
# The transport primitives `qqqai serve` binds with: `ListenAddr` and `Shutdown`.
#
# `qqq-serve` does not re-export them, so the CLI needs its own edge. The direction
# is legal: `qqq-io` is position 4 in §4.3's order and `qqq-run` is position 7, so
# the edge points downward.
qqq-io = { path = "../qqq-io", version = "0.0.0" }
# The benchmark harness (`CLI-013`). `qqq-bench` sits at position 1 in §4.3's
# order, immediately above `qqq-core`, so an edge from `qqq-run` is downward and
# legal.
#
# # Why the CLI depends on the harness rather than the reverse
#
# `PERF-002` alone would be a library that measures something nothing calls -- the
# defect `§O-130` records four times over. `CLI-013` is what makes the ten
# benchmarks reachable, and the two items are one piece of work. Keeping the
# *command* in `qqq-run` and the *measurement* in `qqq-bench` leaves the harness
# usable without a CLI, which is what `§9.1` means when it requires the benchmark
# harness be open source and independently runnable.
qqq-bench = { path = "../qqq-bench", version = "0.0.0" }
qqq-debug = { path = "../qqq-debug", version = "0.0.0" }
# The detached trap report path (`HOST-009`).
#
# `qqq-host` builds a trap's frames two ways and only one was ever wired: while an
# engine is alive, `Wasmtime` resolves each frame through the module's DWARF in
# memory. Once the error has crossed a process boundary -- into a log, a JSON
# response, an agent's context -- that engine is gone, and its frames were stuck at
# `func+0x1a3` with no file and no line. `WasmFrame::offset` existed precisely so
# this could be fixed, and nothing consumed it.
#
# The CLI is the join point: it is the only crate depending on both the crate that
# *produces* a report (`qqq-host`) and the crate that *resolves* one
# (`qqq-debug`). `qqq-host` cannot host the join, because depending on
# `qqq-debug` would place the trap producer above its own resolver and
# `tools/check_topology.py` rejects that upward edge. That rejection is what
# surfaced `qqq-debug` being ordered last in the first place -- it depends on
# `qqq-core` alone, so it now sits at position 2, below everything that could
# consume a source map.
# # Why the CLI needs a runtime of its own
#
# `qqqai bench` (CLI-013) drives qqq_bench::loadgen, which is async because the
# Proposal's §9.1 requires the concurrency level be *disclosed per result* --
# that is what holding a stated number of connections in flight means. `main` is
# synchronous, so the command builds a runtime, runs the load generator on it,
# and drops it.
#
# The alternative considered and rejected: making the whole CLI async. That would
# be a large change to every command to serve one, and the commands that measure
# nothing gain nothing from it.
#
# `qqq-io` already depends on Tokio, so this adds no crate to the graph and no
# supply-chain surface -- only a direct edge, because a transitive dependency is
# not nameable in Rust. `rt-multi-thread` is required rather than the
# single-threaded runtime: a single-threaded *client* would become the bottleneck
# at high concurrency, and the reported throughput would be the harness's ceiling
# rather than the server's.
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# The `verify` tests sign with the project's own signer rather than embedding a `.sig`
# fixture, so the pair cannot drift: a stored blob would be a second copy of the format.
qqq-pkg = { path = "../qqq-pkg", version = "0.0.0" }
ed25519-dalek = { workspace = true }
