[package]
name = "qqq-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "QQQ crate: qqq-sys (see QQQ-Proposal-V1.md 4.3)"

[lints]
workspace = true

[dependencies]
# `serde` is unconditional: `HardenReport` is a serialisable diagnostic on every
# platform, including the ones where every step reports `unsupported`. It sits
# above the target-specific table deliberately — a TOML table runs until the next
# header, so a dependency written *after* `[target.'cfg(...)'.dependencies]` would
# silently become Linux-only, which is a mistake this manifest made once and the
# compiler caught.
serde = { workspace = true }

# The platform dependencies exist to AVOID writing `unsafe` in this crate. The
# full argument is in `src/harden.rs` §"The `unsafe` question"; the short version
# is that `qqq-sys` carries a bare `#![forbid(unsafe_code)]`, and using it would
# trigger the §4.3 exception process — a written safety argument plus a **second
# maintainer** — which `SAFETY.md`'s ledger records as unavailable (`GOV-008`,
# bus factor 1). Safe wrappers sidestep that block rather than defer to it: an
# `unsafe` block we write is an obligation we hold forever, while a safe wrapper
# is an obligation the ecosystem holds and we review once.
#
# Linux-only, because §7.5 lists the host-process and syscall hardening as Linux
# facilities. Declaring them unconditionally would pull a syscall shim into every
# non-Linux build for code that cannot run there.
[target.'cfg(target_os = "linux")'.dependencies]
# Safe `*nix` bindings: `setuid`, `setgid`, `setgroups`, `set_no_new_privs`.
# Features are explicit rather than `full`, so the dependency surface is the set
# of modules this crate calls — and that surface is what a reviewer reads.
# # Why `uio` is among the features, which is the one that is not obvious
#
# `nix::sys::uio::process_vm_readv` is the **seccomp probe**: `tests/harden.rs`
# proves the filter refuses something, by calling `process_vm_readv` on the
# *calling* process after installing the filter.
#
# The probe exists because a Linux run found a real defect (`§O-085`): a filter
# whose default action is `Allow` is still "installed", so every test passed while
# the guard refused nothing. Three probe designs failed before this one -- an
# `unsafe` block the workspace lint correctly forbids, `PTRACE_TRACEME` in the
# child (it stops the process awaiting a tracer), and `TRACEME` in a grandchild
# (the stop happens at `execve`, before the child's code runs).
#
# `process_vm_readv` works because both required properties were measured rather
# than assumed: it **succeeds unfiltered** as uid 1000, and the `Runtime` profile
# **denies** it. The alternatives do not -- `chroot` and `setuid` are denied *and*
# already fail with `EPERM` unfiltered, so a refusal would prove nothing.
#
# The `Runtime` profile is written for a host that must `mmap`, `futex`, `epoll`
# and `accept`; `uio` adds no runtime dependency, only the safe wrapper this probe
# calls. Nothing in the library's non-test code uses it.
nix = { version = "0.31", default-features = false, features = ["user", "process", "uio"] }
# Compiles a BPF seccomp program from a typed filter description and installs it.
# `apply_filter` is the only entry point, and it is safe.
seccompiler = "0.5"
# `libc` is used for exactly two things, both safe and both data: the `SYS_*`
# syscall-number constants (which differ per architecture and must not be
# hard-coded) and `EPERM` as the default-deny errno. No `libc` *function* is
# called, which is why this does not pull the crate into the unsafe exception.
libc = "0.2"
# Landlock LSM, for `SEC-026` — the filesystem half of §7.5's defence in depth.
#
# # Why the earlier note that said this was impossible was wrong
#
# `src/harden.rs` recorded that Landlock "needs a newer kernel API than `nix`
# currently wraps safely". That was true of `nix` and false as a conclusion: a
# dedicated crate exists, is maintained by the Landlock authors, and exposes the
# whole thing safely. The note named a *reason* and stopped, which reads as a
# blocker when it is only a fact about one candidate. Applying `§O-082`'s question
# — "is this blocked on the item, or on one way of doing it?" — dissolved it, the
# same way it dissolved `SEC-017` and `SEC-019`.
#
# Version floor `0.3` rather than `0.4` is deliberate: the API used here
# (`Ruleset`, `AccessFs`, `PathBeneath`) is stable across both, and a lower floor
# spares downstreams a lockfile bump for no benefit.
landlock = "0.4"


[dev-dependencies]
# The hardening tests reconstruct a report from a child process, so they need JSON.
# It is a dev-dependency rather than a real one: the library only ever SERIALISES
# a report (a HardenReport is an output, never an input), so serde_json is a
# test-only concern and pulling it into the library would be an unused dependency.
serde_json = { workspace = true }
