name: CI

# Implements: FND-004, FND-005, DOC-007, CON-016, LIC-010
# Proposal:  §11.1 Install channels, in priority order
#            §2.2 NN-2 — Security and Isolation Are Non-Optional
#            §2.8 NN-8 — Ecosystem Integrity and Long-Term Stewardship
#            §0.4 How to read the cross-references

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # DCO: every commit in a pull request must carry a Signed-off-by line.
  #
  # Pull requests only. A push to `main` is either a merge of an
  # already-checked pull request or a maintainer's direct commit, and the DCO
  # is a contributor certification — requiring it on a revert or a merge commit
  # would fail on commits nobody signed, which is how a check gets disabled.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history is required: an ancestry-based check needs the
          # commits, not just the merge result.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Commits between the merge base and the head -- i.e. exactly the ones
          # this pull request adds.
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          missing=0
          for c in $commits; do
            subject=$(git log -1 --pretty=%s "$c")
            # A trailer is the last block of the message; `git log --format=%B`
            # gives the raw body, and the `Signed-off-by:` line must appear in
            # it. Matching the whole body rather than the last line tolerates a
            # commit edited by tooling that appends after the trailer.
            if git log -1 --pretty=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "  ok    $c $(git log -1 --pretty=%h "$c") $subject"
            else
              echo "  FAIL  $c $subject  -- no Signed-off-by line"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "$missing commit(s) are missing a Signed-off-by line."
            echo "Amend with: git commit --amend -s"
            echo "Or rebase:  git rebase --signoff $BASE"
            exit 1
          fi
          echo "All commits are signed off."

  # ---------------------------------------------------------------------------
  # Line endings: every tracked text file must be LF in the working tree.
  #
  # `.gitattributes` pins `eol=lf` and `core.autocrlf=true` is set on Windows,
  # so the two can disagree: Git *commits* LF while the working tree holds CRLF
  # from an editor that writes it. `git status` then reports files modified
  # after a commit that included them, with an empty `git diff` — and a dirty
  # tree hides real changes.
  #
  # The repository is byte-sensitive (`qqq.lock` carries a covering hash over
  # its own bytes; the content store compares digests), which is why this is a
  # required check rather than a formatting preference.
  #
  # It runs on ubuntu, where checkout honours `.gitattributes` — so a failure
  # here means a committed file's `text`/`binary` attribute is wrong, not that
  # a developer's editor disagreed.
  # ---------------------------------------------------------------------------
  eol:
    name: Line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every tracked text file is LF
        run: python tools/normalize_eol.py --check

      # The tool writes to files, so it needs a self-test more than a read-only
      # checker does: a wrong normalizer corrupts a file silently, and the `.ps1`
      # exemption is the case an over-eager implementation would break. The
      # self-test drives detection, repair and both exceptions on fabricated
      # files in a temp directory.
      - name: Prove the line-ending tool detects and repairs correctly
        run: python tools/normalize_eol.py --self-test

  # ---------------------------------------------------------------------------
  # The cross-reference graph is the thing that keeps three documents honest.
  # If it breaks, nothing else matters. Run it first and cheaply.
  # ---------------------------------------------------------------------------
  xrefs:
    name: Cross-reference integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate proposal <-> checklist graph
        run: python tools/check_xrefs.py

      # **Before the validator, refuse a corpus that carries a left-over injection.**
      #
      # Ordering this first matters. `check_xrefs.py` reports the *symptom* — "the
      # Proposal cites a checklist item that is not defined", "Observations is
      # missing a section heading" — which reads exactly like document drift and
      # sends the reader to edit documents that are correct. The cause is a killed
      # harness run, and this step says so in one line.
      #
      # It exists because the symptom, not the cause, was believed once: a commit
      # shipped the corpus with a renamed `OQ-012` and a deleted `## 4. MISTAKES AND
      # FIXES` heading left by an interrupted `self_test_xrefs.py`, and CI failed on
      # the pushed commit with four errors that all pointed at the wrong thing.
      #
      # `--check-clean` reports and exits non-zero; it never edits the tree, because
      # a gate that silently changes what is being committed is not a gate.
      - name: Refuse a corpus carrying a left-over fault injection
        run: python tools/self_test_xrefs.py --check-clean

      # `SEC-023`. The advisory register is the artifact a user consults *during an
      # incident*, so an index that has drifted from the files beside it is worse
      # than no index: it says "not affected" while the file next to it says
      # otherwise. The self-test runs too, because a register checker that has never
      # rejected anything has never been shown to work.
      - name: Validate the security-advisory register
        run: python tools/check_advisories.py
      - name: Prove the advisory checker actually rejects breakage
        run: python tools/check_advisories.py --self-test

      # `SEC-030`. Four documents state what QQQ does and does not defend against,
      # and when they disagree a reader is misled by whichever they happened to
      # open — with nothing saying which is authoritative. Prose does not fail a
      # build, so this does it instead.
      - name: Validate the published security scope
        run: python tools/check_security_scope.py
      - name: Prove the scope checker rejects disagreement
        run: python tools/check_security_scope.py --self-test

      # `SEC-001`. A threat model's most perishable content is its mitigation-to-code
      # mapping: every `Where:` line names a module a refactor can move, and the
      # document keeps asserting the defence confidently after it has gone.
      - name: Validate the threat model
        run: python tools/check_threat_model.py
      - name: Prove the threat-model checker rejects stale claims
        run: python tools/check_threat_model.py --self-test

      # `DOC-011`. A generated document that does not say so gets hand-edited, and
      # the next generation silently reverts the edit -- a confusing loss that reads
      # as a tool bug. The glossary says it is generated, and this fails the build
      # when it and the Proposal's §0.6 table disagree in *either* direction.
      - name: Validate the generated glossary
        run: python tools/check_glossary.py
      - name: Prove the glossary check catches drift
        run: python tools/check_glossary.py --self-test

      # `DOC-013`. The corrections are recorded in three places -- Appendix A, the
      # Observations' `§C` entries, and docs/reconciliation.md -- because each serves a
      # different reader. Three copies is two too many in principle, and a machine
      # check is the only thing that justifies the arrangement.
      - name: Validate the reconciliation table
        run: python tools/check_reconciliation.py
      - name: Prove the reconciliation check catches drift
        run: python tools/check_reconciliation.py --self-test

      # `DOC-019`. Every `QQQ-XXXX` code becomes a page entry with its cause and its
      # remediation. Generated from the enum so the catalogue cannot be missing a code
      # the runtime can emit -- a user who hits a new code and finds nothing in the
      # catalogue is already having a bad time.
      - name: Validate the error catalogue
        run: python tools/check_error_catalogue.py
      - name: Prove the error-catalogue check catches an incomplete enum
        run: python tools/check_error_catalogue.py --self-test

      # `DOC-017`. The WIT is the published artifact; a hand-written reference is a
      # second copy of an interface that already exists, and when they disagree the
      # WIT is right and the reference is a trap.
      - name: Validate the WIT reference
        run: python tools/check_wit_reference.py
      - name: Prove the WIT-reference check catches a parser regression
        run: python tools/check_wit_reference.py --self-test

      # `DOC-012`. §0.6 says "where a term is contested in the industry, the definition
      # here wins" — which only holds if the WIT docs use those terms as defined. A WIT
      # comment saying "wasm module" gives a component author a second vocabulary, in
      # the artifact they actually read.
      - name: Validate glossary usage in the WIT docs
        run: python tools/check_glossary_usage.py
      - name: Prove the glossary-usage check fires on each confusable term
        run: python tools/check_glossary_usage.py --self-test

      # `DOC-016`. Appendix B states the values; this register adds the cadence each
      # fact carries, so a reader can tell which are still likely to hold. A register
      # with one "verified on" date rots as a whole -- nobody knows which rows still
      # apply, and finding out means re-verifying everything.
      - name: Validate the verified-facts register
        run: python tools/check_verified_facts.py
      - name: Prove every fact has a re-verification cadence
        run: python tools/check_verified_facts.py --self-test

      # `ABI-015`. `qqq-abi` is how the runtime publishes its interfaces. A `.wit` file
      # in the directory but not embedded exists on disk and NOWHERE ELSE — no host can
      # serve it, no binding can be generated, and nothing reports it. The audit that
      # produced this check found the repository already drifted by two files.
      - name: Validate that every WIT file is embedded in qqq-abi
        run: python tools/check_wit_bindings.py
      - name: Prove the bindings check catches drift in both directions
        run: python tools/check_wit_bindings.py --self-test

      # `LIC-006`. A file without an SPDX header has no licence any scanner can
      # determine, and §13.2's model depends on which licence governs which code — the
      # workspace `Cargo.toml` covers the crate, not a file copied out of it.
      - name: Validate SPDX headers on every source file
        run: python tools/check_spdx.py
      - name: Prove the SPDX check rejects a missing or wrong header
        run: python tools/check_spdx.py --self-test

      # `LIC-012`. §13.2 resolves the licence conflict with a one-way wall, and both
      # directions fail differently: runtime → Fabric breaks the Apache-2.0 grant itself,
      # while Fabric → runtime breaks the promise that Fabric is optional. The check
      # reports them separately because the remedies differ.
      - name: Validate the runtime/Fabric licence boundary
        run: python tools/check_license_boundary.py
      - name: Prove the boundary check classifies every crate
        run: python tools/check_license_boundary.py --self-test

      # `DOC-010`. §0.5 says a retired section's anchor is tombstoned, not deleted, so
      # old links resolve. An anchor is a link target OTHER documents point at, so
      # deleting one breaks citations in a file the change never touched.
      - name: Validate that no Proposal anchor was silently deleted
        run: python tools/check_tombstones.py
      - name: Prove the anchor-stability check catches a deletion
        run: python tools/check_tombstones.py --self-test

      # A crate's documented scope table claimed "not implemented" for HTTP/2,
      # TLS, streaming and backpressure long after all four landed -- and the
      # `h2` module itself was **excluded from the module tree** by a leftover
      # debugging line, so 9,370 lines and 201 tests silently stopped being
      # compiled. Hand-written prose about the crate's state was the only thing
      # claiming otherwise and nothing read it. This checker walks `mod`
      # declarations and fails when a file under `src/` is unreachable, which is
      # precisely the defect that shipped. See Observations §O-120.
      - name: Verify each crate's scope table against its module tree
        run: python tools/check_scope_table.py
      - name: Prove the scope-table check detects an orphaned module
        run: python tools/check_scope_table.py --self-test

      # The crate topology is a stated invariant -- "no crate may depend on a
      # crate above it in this list" -- and until this check existed it was
      # enforced by nothing but attention. Two violations had accumulated: the
      # table listed qqq-host above qqq-abi and qqq-run above qqq-pkg, both of
      # which are impossible, because the linker is built *from* the interface
      # registry and the CLI resolves dependencies *via* the package manager.
      #
      # Also asserts that qqq-core, which every other crate depends on, has no
      # I/O -- with a control proving the rule is wired, so it cannot pass
      # forever by being misconfigured.
      - name: Verify the crate topology
        run: python tools/check_topology.py

      # A validator that cannot fail manufactures false confidence. This harness
      # deliberately breaks the corpus and asserts each injection is caught; it
      # prints the count it achieved, so the number is never restated here where
      # it could go stale. See Observations §M-006.
      - name: Prove the validator actually detects breakage
        run: python tools/self_test_xrefs.py

      # **Run the validator again, after the mutating harness.**
      #
      # This harness rewrites three documents and restores them. A kill it cannot
      # catch (`SIGKILL` -- a CI timeout, a cancelled job) leaves an injection
      # applied, and the corpus then contains text no human wrote. The step above
      # would still report its own success, because the injections it applied *were*
      # detected; the damage only shows up later, as a confusing validator failure
      # that reads like real document drift.
      #
      # That is not hypothetical: a leftover `§99.9` marker in the checklist once
      # produced a "the documents have drifted" diagnosis that pointed at three
      # correct documents.
      #
      # The harness now also self-heals -- it detects its own leftovers, reverses
      # the exact substitution, and verifies the repair -- and this step is the
      # independent confirmation that the corpus is internally consistent *after*
      # everything that touches it has run.
      - name: Confirm the corpus survived the harness
        run: python tools/check_xrefs.py

      # `HOST-011` requires every host function to be panic-guarded, and the
      # guard is a *wrapper*: a host function added without it compiles, passes
      # every test that does not panic, and kills the process (the release
      # profile sets `panic = "abort"`) the first time a guest finds the
      # panicking path. No runtime test can enforce that, so the rule is checked
      # at the source level -- and a source-level check is worth exactly as much
      # as its ability to fail. This harness removes one guard, asserts the check
      # goes red with the right message, and restores the file.
      #
      # It deliberately refuses to report success when the injected source fails
      # to *compile*: an injection that does not build proves nothing about the
      # check, which is the failure mode Observations §O-048c records.
      - name: Prove the panic-guard check detects an unguarded host function
        run: python tools/fault_inject_guard.py

      # `ARCH-002`, `ARCH-004` and `ARCH-008` are statements about the
      # *workspace* -- that no crate depends upward, that every crate except the
      # named exceptions forbids `unsafe`, and that no widening primitive exists
      # on `GrantSet`. Each test asserts an ABSENCE, and an absence is trivially
      # satisfied by a scanner that finds nothing, so this harness injects three
      # real violations -- a valid upward dependency, a bare `allow(unsafe_code)`
      # and a `fn union(` on `GrantSet` -- and asserts each makes its own test go
      # red.
      #
      # Every injection must be valid Rust or valid TOML. An injection that
      # breaks the build (for instance by creating a dependency CYCLE rather
      # than merely an upward edge) proves nothing about the check, and the
      # harness reports that case separately as BROKEN rather than as DETECTED.
      - name: Prove the architecture tests detect real violations
        run: python tools/fault_inject_architecture.py

      # `ARCH-009` + §4.3 require every `unsafe`-permitting crate to carry a
      # written safety argument. Exactly one of the four combinations of
      # (`SAFETY.md` present, `unsafe` forbidden) is a violation -- `unsafe`
      # permitted with nothing written down -- and the other three are all
      # legitimate points in the process, including the argument written AHEAD
      # of the code. This harness injects the one violating state and asserts the
      # check fires; injecting either of the legitimate ones would report a false
      # failure and teach the next person to weaken the test.
      - name: Prove the safety-argument check detects an unwritten exception
        run: python tools/fault_inject_safety_arg.py

      # The naming invariant is the project's PUBLIC INSTALL SURFACE. §D-001
      # settles it -- brand QQQ, crate/npm/binary/command all `qqqai`, because
      # `qqq` is taken on crates.io and npm -- and calls it permanent rather than
      # a workaround awaiting a better option. A rename is otherwise discovered by
      # users running `cargo install qqq`, not by CI.
      #
      # This harness injects three realistic ways the rule breaks: a `[[bin]]`
      # renamed to `qqq`, a document teaching `qqq new`, and a package renamed to
      # the taken name. All three must be caught.
      - name: Prove the naming check detects a `qqq` binary
        run: python tools/fault_inject_naming.py

      # The objective audit: does the deliverable set actually satisfy the
      # brief? It checks that all three documents exist and are English, that
      # the Proposal covers the required sections, that the Checklist is fully
      # anchored, and that every machine check passes.
      #
      # It also runs the two validators above, so this is partly redundant with
      # them -- deliberately. This is the check a reader runs to answer "is the
      # objective met?", and it must be answerable from the repository alone
      # rather than by assembling a sequence of commands from a document.
      - name: Objective requirement audit
        run: python tools/audit_requirements.py

  # ---------------------------------------------------------------------------
  # WIT: the interface definitions must actually parse.
  #
  # The Rust tests in qqq-abi check that the registry and the .wit files agree
  # structurally -- every capability maps to exactly one interface, names are
  # versioned, source is present. They CANNOT tell whether a file is valid WIT.
  # The first draft of all thirteen files passed every Rust test while being
  # rejected outright by wasm-tools. This job closes that gap.
  # ---------------------------------------------------------------------------
  wit:
    name: WIT interface validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@wasm-tools
      - name: Validate every interface with wasm-tools
        run: python tools/check_wit.py

      # `check_wit.py` above proves each file PARSES. It cannot prove the
      # annotation policy is followed, and that was verified rather than
      # assumed: `wasm-tools` accepts a WIT file with no `@since` at all and
      # exits 0. NN-5 in the Proposal makes the annotation mandatory, so the
      # contract needs its own check -- a parser proves the language, this
      # proves the contract.
      - name: Validate the WIT versioning policy (CON-007 / CON-008)
        run: python tools/check_wit_since.py

      # And prove that check can fail. Three injections, all of which leave the
      # file PARSEABLE -- including one where a `@since` is moved onto a `use`
      # line and silently annotates the wrong item. That case is why a parser is
      # not sufficient, and the harness refuses to count a detection whose input
      # did not parse.
      #
      # Note the deliberate omission: "`@since` above the package version" is
      # NOT injected, because `wasm-tools` already rejects it and no parseable
      # file triggers our rule. The checker keeps the rule as defence in depth,
      # and the harness says so rather than implying it is exercised.
      - name: Prove the WIT versioning check detects violations
        run: python tools/fault_inject_wit_since.py

      # `CON-009`: every FALLIBLE host call returns a typed error rather than a
      # status code buried in a payload (§2.5, NN-5). The rule is about fallible
      # calls, so the check cannot be "every function returns `result`" --
      # `clock.timezone` genuinely cannot fail while `crypto.decrypt` can. It is
      # therefore "every fallible function returns `result<T, E>`, AND every
      # infallible one is named in an allowlist with the category that makes it
      # infallible" -- which turns "this cannot fail" from an omission into a
      # written claim. 73 functions checked, 19 declared infallible by name.
      #
      # It also rejects `result<T, string>`: the rule's second half requires a
      # NAMED variant, so a caller in any language gets an exhaustive match
      # rather than an integer to compare against constants.
      - name: Validate the typed-error rule (CON-009)
        run: python tools/check_wit_errors.py

      # And prove it can fail, with three injections -- a fallible function with
      # no error type, a primitive error type, and a stale allowlist entry. Every
      # injection leaves the file PARSEABLE, because one that breaks the parser
      # proves nothing about this checker.
      - name: Prove the typed-error check detects violations
        run: python tools/fault_inject_wit_errors.py

      # §2.5 forbids hidden global state in the runtime: no environment-variable
      # reads, no CWD dependencies, no implicit config discovery. A SOURCE check
      # rather than a runtime test, because the violation is an absence of
      # discipline in code no test exercises -- a host interface reading
      # `QQQ_CONFIG` on a path nobody tests behaves identically to a correct one
      # under every test that does not set it.
      #
      # `std::env::consts::*` is allowed: those are compile-time constants of the
      # BUILD, not of the running environment. Two exemptions are named in the
      # tool with their justifications, and they are scoped to
      # (file, construct) rather than to the file -- so the exempted `var_os` in
      # `RealEnv` does not blanket-cover a bare `var` beside it.
      - name: Validate no hidden global state (CON-010 / CON-018)
        run: python tools/check_no_ambient.py

      - name: Prove the ambient-state check detects violations
        run: python tools/fault_inject_no_ambient.py

      # §8.3: "CI fails if it drifts from the implementation." Three surfaces
      # have a machine-readable contract derived from Rust types -- `qqq.toml`,
      # `qqq.lock` and the CLI envelope -- and they are published under
      # `schema/`. Regenerating is a separate command; CI only checks.
      #
      # The check is paired with its self-test for the reason this workspace has
      # recorded five times: a checker that has never been shown to fail might
      # always pass. The six injections break the generator's INPUTS (an added
      # field, an unknown type, a stripped `as_str`, emptied sources) and its
      # OUTPUTS (a deleted schema, a hand-edited one) separately, and injection 6
      # is the anti-vacuity case -- emptied sources must fail rather than emit a
      # schema with `"properties": {}`, which would describe every possible
      # document (CON-016).
      - name: Validate published schemas match the implementation (CON-016)
        run: python tools/gen_schemas.py --check

      - name: Prove the schema-drift check detects drift
        run: python tools/self_test_schemas.py

      # §8.5: "llms.txt at repo root and docs site — curated index of what to
      # read, in what order" and "llms-full.txt — full documentation concatenated
      # for context loading". Generated rather than hand-written, so the index
      # cannot describe a file that is not there and a new document cannot go
      # unlisted.
      #
      # One exclusion in that generator is a SECURITY control rather than a
      # judgement: `docs/.env` holds credentials, and an index linking to it, or a
      # corpus embedding it, would be a leak into a file designed to be pasted
      # into a model's context window.
      - name: Validate the llms.txt index and corpus (DOC-020)
        run: python tools/gen_llms_txt.py --check

      - name: Prove the llms.txt check detects drift and a stale exclusion
        run: python tools/gen_llms_txt.py --self-test

      # §4.5: "a host interface that would naturally be called in a loop must
      # instead accept a batch" (CON-012). The operative phrase is a judgement
      # about usage, which NO checker can make -- so this checks the decidable
      # half: every DECLARED batch pair must be real, must actually take a
      # collection, and must agree with its singular form on the error type.
      #
      # It deliberately does not demand a batch form for every singular function.
      # An earlier version did, and produced 23 demanded classifications
      # including `sql.txn.commit` and `trace.span.event` -- operations that are
      # inherently singular. A tool demanding a written excuse for each of those
      # generates paperwork, and paperwork gets allow-ed away.
      - name: Validate the batch-first rule where it is decidable (CON-012)
        run: python tools/check_batch_first.py

      - name: Prove the batch-first check detects pair defects
        run: python tools/fault_inject_batch_first.py

  # ---------------------------------------------------------------------------
  # Rust: format, lints, build, test.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        # **`@master` with no `toolchain:` input reads `rust-toolchain.toml`.**
        #
        # This was `@stable`, which names whatever `stable` is on the day the job
        # runs -- a moving target that silently diverged from the toolchain on a
        # developer's machine. It cost three red CI runs: `chunks_exact` with a
        # constant chunk size is a lint added in 1.98, the local toolchain was
        # 1.97.1, and a commit that passed `clippy -- -D warnings` three times
        # locally was rejected on all three Rust platforms (Observations §O-121).
        #
        # The rule that came out of it: **reproduce the exact command CI runs, in
        # the environment CI runs it in**. A command is not the whole
        # specification; the toolchain version is part of it. Reading the file
        # makes the two agree by construction rather than by coincidence.
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --workspace --all-features --verbose

      - name: test
        run: cargo test --workspace --all-features --verbose

      # §12.3's DX-commitments table is titled "measurable, in CI", and its row
      # is `qqqai --help` for any command <= 40 lines. The unit test asserts it,
      # but a number buried in test output is not *measured* in the sense the
      # table means -- so this prints the count as its own CI step, where a
      # reviewer sees it.
      #
      # Measured before this step existed: 53 lines. After: 39.
      - name: the --help brevity standard (DX-013)
        shell: bash
        run: |
          set -euo pipefail
          BIN=./target/debug/qqqai

          # # Why this measures a PIPE rather than a shell variable
          #
          # The first version did `HELP="$(./target/debug/qqqai --help)"` and then
          # counted lines in `$HELP`. Measured while building the step: a 1890-byte
          # help output containing a UTF-8 em-dash yields **`len=0`** under some
          # bash builds -- command substitution silently drops the value, and
          # setting `LANG`/`LC_ALL` to `C.UTF-8` did not change it.
          #
          # The consequence would have been the worst kind. `LINES` would be empty,
          # `[ "" -gt 40 ]` would not be true, and the budget assertion would
          # **pass vacuously** -- the failure class this project has recorded six
          # times (`M-006`, `O-092`, `O-103`, `O-108`, `O-111`, `O-115`).
          #
          # So the step never holds the text. It counts lines in a pipe and greps a
          # pipe. Verified: `sh wrapper | wc -l` returns **39** on the same machine
          # where `HELP="$(cat file)"` returned length 0.
          LINES="$("$BIN" --help | wc -l | tr -d ' ')"

          # The anti-vacuity guard is kept even though the pipeline makes the
          # failure unlikely, because it is what turns "the measurement did not
          # happen" into a hard failure rather than a comparison against nothing.
          case "$LINES" in
            ''|*[!0-9]*)
              echo "::error::the line count is not a number: '$LINES'"
              echo "::error::the budget check would have been vacuous"
              exit 1
              ;;
          esac
          echo "qqqai --help: $LINES lines (budget 40)"

          # Every command must still be present -- a budget met by printing less
          # than the tool has is not the standard.
          #
          # The list is on ONE line deliberately: an earlier version used a
          # backslash continuation, which mangled the word list and produced
          # `::error::the help omits the  command` with an empty name -- a red
          # build that said nothing about the code.
          PRESENT=0
          for cmd in new build run dev serve test inspect audit verify caps why trace doctor mcp schema migrate; do
            "$BIN" --help | grep -q "^    $cmd " || {
              echo "::error::the help omits the $cmd command"
              exit 1
            }
            PRESENT=$((PRESENT + 1))
          done

          # And the loop itself must have run. Without this, a bug that skipped it
          # would look exactly like every command being present.
          if [ "$PRESENT" -ne 16 ]; then
            echo "::error::expected to check 16 commands, checked $PRESENT"
            exit 1
          fi

          if [ "$LINES" -gt 40 ]; then
            echo "::error::qqqai --help prints $LINES lines, over the 40-line budget"
            exit 1
          fi
          echo "::notice::help is within budget at $LINES lines; $PRESENT commands listed"

      # ARCH-008 / NN-2: prove the forbidden-unsafe invariant actually holds.
      - name: no unsafe without an audited exception
        shell: bash
        run: |
          set -euo pipefail
          # qqq-sys is the only crate permitted to contain unsafe code.
          #
          # The pattern matches the `unsafe` KEYWORD in code positions:
          #   `unsafe {`, `unsafe fn`, `unsafe impl`, `unsafe extern`, `unsafe trait`
          # It deliberately does NOT match the word appearing in prose.
          #
          # An earlier version grepped for the bare word `\bunsafe\b` and failed
          # on a comment reading "which is the unsafe direction". A check that
          # fires on documentation is a check people learn to work around, and
          # the workaround (deleting the word) makes the code less clear.
          violations=$(grep -rnE --include='*.rs' \
            '\bunsafe[[:space:]]*(\{|fn\b|impl\b|extern\b|trait\b)' crates \
            | grep -v '^crates/qqq-sys/' \
            | grep -v 'forbid(unsafe_code)' \
            | grep -v '#!\[cfg_attr' || true)
          if [ -n "$violations" ]; then
            echo "::error::unsafe code found outside crates/qqq-sys:"
            echo "$violations"
            exit 1
          fi
          echo "OK: no unsafe code outside the audited exception crate"

          # And the belt to that braces: every crate except qqq-sys must carry
          # the attribute, so a new crate cannot silently omit it.
          missing=$(for d in crates/*/; do
            name=$(basename "$d")
            [ "$name" = "qqq-sys" ] && continue
            grep -q 'forbid(unsafe_code)' "$d/src/lib.rs" 2>/dev/null || echo "$name"
          done)
          if [ -n "$missing" ]; then
            echo "::error::these crates lack #![forbid(unsafe_code)]:"
            echo "$missing"
            exit 1
          fi
          echo "OK: every crate except qqq-sys forbids unsafe code"

      # SEC-020: the `unsafe` audit, as a scripted and self-testing gate.
      #
      # # Why this replaces an inline grep rather than duplicating it
      #
      # The step above proves the *lint policy* holds. This one proves the
      # *count* is zero, with three properties the inline version lacks:
      #
      #   1. **It separates prose from code.** The inline grep has to be read
      #      carefully to see that it only matches code positions; a script whose
      #      doc comment explains its classification is checkable at a glance.
      #   2. **It reports what it scanned.** "0 findings across 85 files" and
      #      "0 findings" are different claims, and only the first is falsifiable
      #      — a scanner pointed at the wrong directory also finds nothing.
      #   3. **It is one implementation, run identically here and locally.** An
      #      inline shell pipeline only ever runs in CI, which is the failure
      #      `§O-055` records: a check the author never sees fail.
      #
      # It also covers both lint escapes (`allow` and `cfg_attr(..., allow)`),
      # where the inline version exempts anything matching `#![cfg_attr` — a
      # broader exemption than the thing it is guarding against.
      - name: unsafe audit (SEC-020)
        run: python tools/audit_unsafe.py

      # The audit's zero is only evidence if the audit can find a one. This
      # injects all seven `unsafe` forms into a temporary tree and fails if any is
      # missed -- and it checks three PROSE controls too, because a scanner whose
      # only tests are injections happily over-reports, and an audit that cries
      # wolf is one people stop running. It caught exactly that bug during
      # development: a string literal containing `unsafe {` was flagged as code.
      - name: unsafe audit is live (SEC-020)
        run: python tools/audit_unsafe.py --self-test

  # ---------------------------------------------------------------------------
  # Supply chain: licences, advisories, unused dependencies.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Reads `rust-toolchain.toml`, like the Rust job: see the note there for why
      # `@stable` was a moving target that cost three red runs (§O-121).
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      # Both checks are now **required**, not advisory.
      #
      # They previously carried `continue-on-error: true`, with a note that
      # `deny.toml` would land with LIC-007. Without that file cargo-deny fell
      # back to its default allowlist and rejected `Apache-2.0 OR MIT`, so it
      # failed on every run — and a red check that everyone knows is red stops
      # being read. cargo-machete was also finding three real unused
      # dependencies, which are now removed.
      #
      # Removing the escape hatch is the point: an unconditionally-failing check
      # and an unconditionally-passing one carry the same information (`§M-006`).
      - name: cargo-deny (licences + advisories)
        run: cargo deny check

      - name: cargo-machete (unused dependencies)
        run: cargo machete

      # `SEC-028`. The SBOM is produced and **published as a build artifact**, not
      # merely generated and discarded.
      #
      # # Why the distinction is the whole item
      #
      # "Produce an SBOM" is satisfied by a command that writes a file to a runner's
      # ephemeral disk, and that satisfies nothing a consumer needs. An SBOM is only
      # useful to the person asking "am I affected by CVE-X?" if they can *obtain*
      # it — so the job uploads it, and the upload is what makes the step real.
      #
      # # Why CycloneDX
      #
      # It is the format downstream tooling (Dependency-Track, Grype, Trivy, GitHub's
      # dependency graph) already consumes, and it is machine-readable without a
      # licence negotiation. SPDX would be equally defensible; CycloneDX is chosen
      # for the ecosystem fit and recorded here so the choice is a decision rather
      # than a default.
      #
      # # Why the `--spec-version` is pinned
      #
      # An SBOM whose schema version changes between two runs of the same commit is
      # not reproducible, and reproducibility is the property a consumer audits. The
      # version is stated so a bump is a visible change to this file.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx

      - name: Generate the SBOM (CycloneDX)
        run: |
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --describe crate \
            --all

      # The files land beside each crate's manifest; gather them so one artifact
      # carries the whole graph rather than N files nobody finds.
      #
      # # Why the exclusion list is explicit
      #
      # `cargo cyclonedx` writes `<crate>.cdx.json` next to each `Cargo.toml`, and
      # the first version of this step used `find crates fuzz` — which also walked
      # `crates/*/target/` on a runner that had built in place, collecting stale
      # files from an earlier target directory. The paths are pruned rather than
      # filtered afterwards so the intent is visible.
      - name: Collect the SBOM files
        run: |
          mkdir -p sbom
          find crates fuzz \
            -name '*.cdx.json' \
            -not -path '*/target/*' \
            -exec cp {} sbom/ \;
          echo "Generated $(ls -1 sbom | wc -l) SBOM file(s):"
          ls -1 sbom

      # **The check that the SBOM is not empty or malformed.**
      #
      # A generation step that emitted a syntactically valid but empty document
      # would pass `cargo cyclonedx` and be worthless — the `§O-085` shape in a
      # supply-chain artifact. This asserts each file parses as JSON and names at
      # least one component, so "the SBOM exists" is a statement about its contents.
      - name: Assert the SBOM is well formed and non-empty
        run: python tools/check_sbom.py sbom

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # The production image: distroless, read-only root, non-root (`SEC-029`).
  #
  # # Why every property is asserted rather than declared
  #
  # "Distroless" and "non-root" are claims about an artifact, and a `Dockerfile` that
  # says `FROM distroless` and `USER 65532` does not prove either. Both can be
  # defeated by an unrelated change -- a base-image tag that starts shipping a shell,
  # a build step that runs as root and leaves a setuid helper -- and the failure is
  # invisible because the image still *works*.
  #
  # So each property is a command whose output is checked, on every commit. That is
  # the difference between a hardened image and an image that claims to be.
  # ---------------------------------------------------------------------------
  production-image:
    name: Production image (SEC-029)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the distroless image
        run: docker build -f docker/Dockerfile.prod -t qqqai:ci .

      # **No shell.** This is the property that removes a whole class of
      # post-exploitation behaviour, and it is asserted by *trying to use one* rather
      # than by reading the base image's name.
      - name: Assert the image has no shell
        run: |
          if docker run --rm --entrypoint /bin/sh qqqai:ci -c 'echo present' 2>/dev/null; then
            echo "FATAL: /bin/sh exists in the production image."
            echo "This removes the property the distroless base was chosen for: an"
            echo "attacker who reaches the process gains a shell, and with it the"
            echo "ability to run further commands."
            exit 1
          fi
          echo "OK: no /bin/sh in the image"

      # **Read-only root.** The image must run with no writable filesystem, which
      # means the process writes nothing outside its data volumes at startup.
      - name: Assert it runs with a read-only root filesystem
        run: |
          docker run --rm --read-only qqqai:ci --help > /dev/null
          echo "OK: the binary runs with --read-only"

      # **Non-root.** Both the declared user and the uid the process actually runs
      # as, because those can differ.
      - name: Assert the process is not root
        run: |
          declared=$(docker inspect qqqai:ci --format '{{.Config.User}}')
          echo "declared user: ${declared}"
          if [ "${declared}" = "root" ] || [ -z "${declared}" ]; then
            echo "FATAL: the image declares no user, which means uid 0."
            exit 1
          fi
          echo "OK: the image declares a non-root user"

      # **The binary works.** A hardened image that cannot run the program is not a
      # deliverable, and every check above would pass on an empty image.
      - name: Assert the CLI actually runs
        run: |
          docker run --rm --read-only qqqai:ci --help | tee /tmp/help.txt
          if ! grep -q 'qqqai' /tmp/help.txt; then
            echo "FATAL: the CLI did not print its help output"
            exit 1
          fi
          echo "OK: the CLI runs under every hardening flag"

  # ---------------------------------------------------------------------------
  # Fuzzing targets: they must still COMPILE.
  #
  # SEC-012/SEC-013. The nightly `Fuzz` workflow runs them; this job proves they
  # still build, on every commit and on stable CI infrastructure.
  #
  # # Why a compile check is worth a job of its own
  #
  # `fuzz/` is a separate workspace, so `cargo build --workspace` at the root does
  # not touch it -- and nothing else does either. That means a signature change in
  # `qqq-cap` or `qqq-host` breaks the fuzz targets **silently**: the nightly job
  # would fail at 03:17, and the distance between the commit that caused it and
  # the failure would be up to a day with several unrelated commits in between.
  #
  # The regression corpus in `crates/*/tests/fuzz_corpus.rs` cannot cover this,
  # because it is deliberately written against the *public* API on stable Rust and
  # does not use `libfuzzer-sys`. So the targets need their own check, and this is
  # it. The cost is a few seconds; the alternative is discovering a broken fuzzing
  # programme a day later, or never.
  # ---------------------------------------------------------------------------
  fuzz-targets:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        #
        # Required for the LINK step below. `cargo +nightly check` does not need it
        # — that is plain cargo — which is why the first version of this job could
        # run `check` and then fail on `cargo fuzz build` with
        # `error: no such command: fuzz` and exit 101.
        #
        # `--locked` so the fuzzing toolchain is reproducible: an unpinned
        # `cargo-fuzz` would be a component of the programme that changes without a
        # commit, and a failure caused by a new release would look like a failure
        # in this repository.
        run: cargo +nightly install cargo-fuzz --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # A separate cache key, because this job builds the `fuzz/` workspace
          # with a different toolchain from every other job.
          workspaces: fuzz

      - name: Every fuzz target compiles
        run: |
          set -euo pipefail
          cd fuzz
          cargo +nightly check --all-targets

      - name: The fuzz targets LINK and produce a runnable binary
        #
        # `check` proves the targets type-check; it proves nothing about whether
        # they can be built into something runnable. A linker failure is a
        # *platform* failure and is exactly the kind that goes unnoticed until the
        # nightly job fails at 03:17 -- which is how this step came to exist: on
        # Windows, `crate-type = ["cdylib", "lib"]` made the link fail with
        # `LNK2001: unresolved external symbol main`, and only an actual build
        # surfaced it.
        run: |
          set -euo pipefail
          cd fuzz
          cargo +nightly fuzz build

      - name: The regression corpus also runs
        # The corpus lives in the main workspace and is already covered by
        # `cargo test --workspace`, but running it here makes this job's evidence
        # self-contained: a reviewer reading the fuzzing job's log sees BOTH
        # halves of the programme, and does not have to trust that the other job
        # ran.
        run: |
          set -euo pipefail
          cargo test -p qqq-cap --test fuzz_corpus
          cargo test -p qqq-host --test fuzz_corpus
