name: CI

# Implements: FND-004, FND-005, DOC-007, CON-016, LIC-010
# Proposal:  §11.1 Install channels, in priority order
#            §2.2 NN-2 — Security and Isolation Are Non-Optional
#            §2.8 NN-8 — Ecosystem Integrity and Long-Term Stewardship
#            §0.4 How to read the cross-references

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # DCO: every commit in a pull request must carry a Signed-off-by line.
  #
  # Pull requests only. A push to `main` is either a merge of an
  # already-checked pull request or a maintainer's direct commit, and the DCO
  # is a contributor certification — requiring it on a revert or a merge commit
  # would fail on commits nobody signed, which is how a check gets disabled.
  # ---------------------------------------------------------------------------
  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # 10 min, from a measured n/a (skipped on push) on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The full history is required: an ancestry-based check needs the
          # commits, not just the merge result.
          fetch-depth: 0

      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Commits between the merge base and the head -- i.e. exactly the ones
          # this pull request adds.
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          missing=0
          for c in $commits; do
            subject=$(git log -1 --pretty=%s "$c")
            # A trailer is the last block of the message; `git log --format=%B`
            # gives the raw body, and the `Signed-off-by:` line must appear in
            # it. Matching the whole body rather than the last line tolerates a
            # commit edited by tooling that appends after the trailer.
            if git log -1 --pretty=%B "$c" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "  ok    $c $(git log -1 --pretty=%h "$c") $subject"
            else
              echo "  FAIL  $c $subject  -- no Signed-off-by line"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "$missing commit(s) are missing a Signed-off-by line."
            echo "Amend with: git commit --amend -s"
            echo "Or rebase:  git rebase --signoff $BASE"
            exit 1
          fi
          echo "All commits are signed off."

  # ---------------------------------------------------------------------------
  # Line endings: every tracked text file must be LF in the working tree.
  #
  # `.gitattributes` pins `eol=lf` and `core.autocrlf=true` is set on Windows,
  # so the two can disagree: Git *commits* LF while the working tree holds CRLF
  # from an editor that writes it. `git status` then reports files modified
  # after a commit that included them, with an empty `git diff` — and a dirty
  # tree hides real changes.
  #
  # The repository is byte-sensitive (`qqq.lock` carries a covering hash over
  # its own bytes; the content store compares digests), which is why this is a
  # required check rather than a formatting preference.
  #
  # It runs on ubuntu, where checkout honours `.gitattributes` — so a failure
  # here means a committed file's `text`/`binary` attribute is wrong, not that
  # a developer's editor disagreed.
  # ---------------------------------------------------------------------------
  eol:
    name: Line endings
    runs-on: ubuntu-latest
    # 10 min, from a measured 0.1 on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every tracked text file is LF
        run: python tools/normalize_eol.py --check

      # The tool writes to files, so it needs a self-test more than a read-only
      # checker does: a wrong normalizer corrupts a file silently, and the `.ps1`
      # exemption is the case an over-eager implementation would break. The
      # self-test drives detection, repair and both exceptions on fabricated
      # files in a temp directory.
      - name: Prove the line-ending tool detects and repairs correctly
        run: python tools/normalize_eol.py --self-test

      # The four checkers below inject a defect into a *generated* tracked
      # document, run the generator, and restore it. Every one of those
      # read-modify-write cycles went through `Path.write_text`, which translates
      # `\n` to `os.linesep` -- `\r\n` on Windows -- so each left a tracked file
      # that this job's line-ending check rejects. No job ran both, which is why
      # the defect was latent rather than caught; the writers are byte-faithful
      # now, and this step is the regression guard that would have found it.
      #
      # # Why the job's own files are asserted LF first
      #
      # The guard is only meaningful if a CRLF result can be seen. On a runner
      # whose core.autocrlf is true the checkout itself could be CRLF, the guard
      # would report every file, and the noise would be read as the guard being
      # broken rather than the checkout being misconfigured. Two lines of proof
      # remove that ambiguity: `.gitattributes` must agree with `core.autocrlf`
      # for this to be a line-ending test at all, and `git ls-files --eol` must
      # see the tracked state as LF before any self-test runs.
      - name: Prove the checkout is LF before judging anything else
        run: |
          echo "core.autocrlf=$(git config --get core.autocrlf || echo '(unset)')"
          echo "--- tracked end-of-line state (must be i/lf) ---"
          git ls-files --eol | grep -v '\.gitattributes' | awk '$1 != "i/lf" && $1 != "i/none" { print "NOT LF: " $0; bad=1 } END { exit bad ? 1 : 0 }'
          echo "every tracked file is i/lf or i/none"

      - name: Prove the self-tests do not leave the tree with the wrong endings
        run: |
          python tools/check_error_catalogue.py --self-test
          python tools/check_glossary.py --self-test
          python tools/check_reconciliation.py --self-test
          python tools/check_wit_reference.py --self-test
          python tools/check_tombstones.py --self-test
          python tools/check_checklist_counts.py --self-test
          python tools/check_lifecycle_counts.py --self-test
          python tools/check_advisories.py --self-test
          python tools/check_verified_facts.py --self-test
          python tools/check_corpus_repair.py --self-test
          python tools/check_handoff.py --self-test
          python tools/check_xrefs.py --self-test
          # `DET-009` / `DOD-003`: the 10,000-trial harness's own guards.  Pure logic -- no built
          # `qqqai` and no guest required -- so it runs in both gates and the instrument behind the
          # published determinism number is itself watched failing.  The measurement is re-derived
          # by `python tools/det009_trials.py --full` where a CLI binary exists.
          python tools/det009_trials.py --self-test
          python tools/self_test_xrefs.py --check-clean
          python tools/self_test_xrefs.py --prove-isolation
          python tools/normalize_eol.py --check

  # ---------------------------------------------------------------------------
  # The cross-reference graph is the thing that keeps three documents honest.
  # If it breaks, nothing else matters. Run it first and cheaply.
  # ---------------------------------------------------------------------------
  xrefs:
    name: Cross-reference integrity
    runs-on: ubuntu-latest
    # 25 min, from a measured 3.1 on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate proposal <-> checklist graph
        run: python tools/check_xrefs.py

      # A leaked `\uXXXX` renders as literal text in Markdown, so a cross-reference that
      # *looks* present is absent to a `grep` for the real character. This happened: a
      # `` `\u00a7O-189` `` sat in Observations where `§O-189` belonged. The scanner fires on
      # `\u` alone and stays silent on the `\x`/`\*` byte and regex literals the corpus
      # legitimately quotes, so it can be satisfied rather than worked around.
      - name: Refuse a document carrying the text of a Unicode escape
        run: python tools/check_unicode_escapes.py
      - name: Prove the escape scanner fires on a leak and stays silent on source text
        run: python tools/check_unicode_escapes.py --self-test

      # `CON-011`. Proposal §6.3 states six WIT style rules and says they are enforced in
      # review; four now have a machine check. This is the file that covers the other three,
      # and its scope note records which half of rule 2 is decidable and which stays a
      # judgement.
      - name: Enforce the WIT style rules (CON-011)
        run: python tools/check_wit_style.py
      - name: Prove the WIT style rules reject breakage
        run: python tools/check_wit_style.py --self-test

      # **Before the validator, refuse a corpus that carries a left-over injection.**
      #
      # Ordering this first matters. `check_xrefs.py` reports the *symptom* — "the
      # Proposal cites a checklist item that is not defined", "Observations is
      # missing a section heading" — which reads exactly like document drift and
      # sends the reader to edit documents that are correct. The cause is a killed
      # harness run, and this step says so in one line.
      #
      # It exists because the symptom, not the cause, was believed once: a commit
      # shipped the corpus with a renamed `OQ-012` and a deleted `## 4. MISTAKES AND
      # FIXES` heading left by an interrupted `self_test_xrefs.py`, and CI failed on
      # the pushed commit with four errors that all pointed at the wrong thing.
      #
      # `--check-clean` reports and exits non-zero; it never edits the tree, because
      # a gate that silently changes what is being committed is not a gate.
      - name: Refuse a corpus carrying a left-over fault injection
        run: python tools/self_test_xrefs.py --check-clean

      # The **repair** path, which is what handles the case above once it happens.
      #
      # `--check-clean` refuses; `assert_clean_corpus` in the same file repairs. That
      # repair is the program a person runs after a killed harness, and it had a
      # `NameError` in its verification loop — so it restored the file, printed
      # `repaired: ...`, and then died with exit 1 on a corpus it had just made clean
      # (§O-191). Nothing caught it, because no test drove the function: every path it
      # touches is a real document, so a test meant mutating the repository.
      #
      # `tools/check_corpus_repair.py` copies the corpus to a temporary directory,
      # re-points the harness's own path constants at the copy, and calls the real
      # function — then asserts the real documents are byte-identical afterwards,
      # which is the property the basename-only transcript cannot show. Found by using
      # it; wired here so the next regression is caught by the gate rather than by a
      # developer reading a traceback.
      - name: Prove the corpus repair path works
        run: python tools/check_corpus_repair.py
      - name: Prove the repair check catches a broken repair
        run: python tools/check_corpus_repair.py --self-test

      # `SEC-023`. The advisory register is the artifact a user consults *during an
      # incident*, so an index that has drifted from the files beside it is worse
      # than no index: it says "not affected" while the file next to it says
      # otherwise. The self-test runs too, because a register checker that has never
      # rejected anything has never been shown to work.
      - name: Validate the security-advisory register
        run: python tools/check_advisories.py
      - name: Prove the advisory checker actually rejects breakage
        run: python tools/check_advisories.py --self-test

      # `SEC-030`. Four documents state what QQQ does and does not defend against,
      # and when they disagree a reader is misled by whichever they happened to
      # open — with nothing saying which is authoritative. Prose does not fail a
      # build, so this does it instead.
      - name: Validate the published security scope
        run: python tools/check_security_scope.py
      - name: Prove the scope checker rejects disagreement
        run: python tools/check_security_scope.py --self-test

      # `SEC-001`. A threat model's most perishable content is its mitigation-to-code
      # mapping: every `Where:` line names a module a refactor can move, and the
      # document keeps asserting the defence confidently after it has gone.
      - name: Validate the threat model
        run: python tools/check_threat_model.py
      - name: Prove the threat-model checker rejects stale claims
        run: python tools/check_threat_model.py --self-test

      # `DOC-011`. A generated document that does not say so gets hand-edited, and
      # the next generation silently reverts the edit -- a confusing loss that reads
      # as a tool bug. The glossary says it is generated, and this fails the build
      # when it and the Proposal's §0.6 table disagree in *either* direction.
      - name: Validate the generated glossary
        run: python tools/check_glossary.py
      - name: Prove the glossary check catches drift
        run: python tools/check_glossary.py --self-test

      # `DOC-013`. The corrections are recorded in three places -- Appendix A, the
      # Observations' `§C` entries, and docs/reconciliation.md -- because each serves a
      # different reader. Three copies is two too many in principle, and a machine
      # check is the only thing that justifies the arrangement.
      - name: Validate the reconciliation table
        run: python tools/check_reconciliation.py
      - name: Prove the reconciliation check catches drift
        run: python tools/check_reconciliation.py --self-test

      # `DOC-019`. Every `QQQ-XXXX` code becomes a page entry with its cause and its
      # remediation. Generated from the enum so the catalogue cannot be missing a code
      # the runtime can emit -- a user who hits a new code and finds nothing in the
      # catalogue is already having a bad time.
      - name: Validate the error catalogue
        run: python tools/check_error_catalogue.py
      - name: Prove the error-catalogue check catches an incomplete enum
        run: python tools/check_error_catalogue.py --self-test

      # `DOC-017`. The WIT is the published artifact; a hand-written reference is a
      # second copy of an interface that already exists, and when they disagree the
      # WIT is right and the reference is a trap.
      - name: Validate the WIT reference
        run: python tools/check_wit_reference.py
      - name: Prove the WIT-reference check catches a parser regression
        run: python tools/check_wit_reference.py --self-test

      # `DOC-012`. §0.6 says "where a term is contested in the industry, the definition
      # here wins" — which only holds if the WIT docs use those terms as defined. A WIT
      # comment saying "wasm module" gives a component author a second vocabulary, in
      # the artifact they actually read.
      - name: Validate glossary usage in the WIT docs
        run: python tools/check_glossary_usage.py
      - name: Prove the glossary-usage check fires on each confusable term
        run: python tools/check_glossary_usage.py --self-test

      # `DOC-016`. Appendix B states the values; this register adds the cadence each
      # fact carries, so a reader can tell which are still likely to hold. A register
      # with one "verified on" date rots as a whole -- nobody knows which rows still
      # apply, and finding out means re-verifying everything.
      - name: Validate the verified-facts register
        run: python tools/check_verified_facts.py
      - name: Prove every fact has a re-verification cadence
        run: python tools/check_verified_facts.py --self-test

      # `ABI-015`. `qqq-abi` is how the runtime publishes its interfaces. A `.wit` file
      # in the directory but not embedded exists on disk and NOWHERE ELSE — no host can
      # serve it, no binding can be generated, and nothing reports it. The audit that
      # produced this check found the repository already drifted by two files.
      - name: Validate that every WIT file is embedded in qqq-abi
        run: python tools/check_wit_bindings.py
      - name: Prove the bindings check catches drift in both directions
        run: python tools/check_wit_bindings.py --self-test

      # The vendored copies under `deps/` are the artefact a guest author's toolchain
      # actually consumes. `check_wit_bindings.py` guards the relationship between `wit/`
      # and the registry, and does not look at `deps/` — so a corrected interface could
      # leave a vendored copy asserting a **retracted** guarantee, in the file a guest
      # reads. That is what happened to `qqq-http`'s egress paragraph (`§O-270`).
      - name: Validate that every vendored WIT copy matches its source
        run: python tools/check_wit_vendoring.py
      - name: Prove the vendoring check catches a drifted copy
        run: python tools/check_wit_vendoring.py --self-test

      # `LIC-006`. A file without an SPDX header has no licence any scanner can
      # determine, and §13.2's model depends on which licence governs which code — the
      # workspace `Cargo.toml` covers the crate, not a file copied out of it.
      - name: Validate SPDX headers on every source file
        run: python tools/check_spdx.py
      - name: Prove the SPDX check rejects a missing or wrong header
        run: python tools/check_spdx.py --self-test

      # `LIC-012`. §13.2 resolves the licence conflict with a one-way wall, and both
      # directions fail differently: runtime → Fabric breaks the Apache-2.0 grant itself,
      # while Fabric → runtime breaks the promise that Fabric is optional. The check
      # reports them separately because the remedies differ.
      - name: Validate the runtime/Fabric licence boundary
        run: python tools/check_license_boundary.py
      - name: Prove the boundary check classifies every crate
        run: python tools/check_license_boundary.py --self-test

      # `DOC-010`. §0.5 says a retired section's anchor is tombstoned, not deleted, so
      # old links resolve. An anchor is a link target OTHER documents point at, so
      # deleting one breaks citations in a file the change never touched.
      - name: Validate that no Proposal anchor was silently deleted
        run: python tools/check_tombstones.py
      - name: Prove the anchor-stability check catches a deletion
        run: python tools/check_tombstones.py --self-test

      # A crate's documented scope table claimed "not implemented" for HTTP/2,
      # TLS, streaming and backpressure long after all four landed -- and the
      # `h2` module itself was **excluded from the module tree** by a leftover
      # debugging line, so 9,370 lines and 201 tests silently stopped being
      # compiled. Hand-written prose about the crate's state was the only thing
      # claiming otherwise and nothing read it. This checker walks `mod`
      # declarations and fails when a file under `src/` is unreachable, which is
      # precisely the defect that shipped. See Observations §O-120.
      - name: Verify each crate's scope table against its module tree
        run: python tools/check_scope_table.py
      - name: Prove the scope-table check detects an orphaned module
        run: python tools/check_scope_table.py --self-test

      # The toolchain version is stated in four places, because an action input
      # cannot reference a file: `rust-toolchain.toml`, two `toolchain:` inputs in
      # this workflow, and one in `advisories.yml`. `dtolnay/rust-toolchain@master`
      # requires an explicit channel, so they cannot be reduced to one source --
      # this check is the substitute. It also asserts the MSRV is the *older* of
      # the two numbers, and refuses a moving channel like `stable`, which is what
      # caused §O-121 in the first place.
      - name: Verify every stated toolchain version agrees
        run: python tools/check_toolchain.py
      - name: Prove the toolchain check detects drift and a moving channel
        run: python tools/check_toolchain.py --self-test

      # The rule *"add a checker to BOTH `ci.yml` and `docker/entrypoint.sh`"* is stated about a
      # dozen times and was enforced by nothing. Measured 2026-09-25: 20 commands ran in one gate
      # and not the other, and eighteen of them had no recorded reason -- the divergence had
      # accumulated rather than been decided. This compares the two gates, reads the declared
      # divergences out of `entrypoint.sh`, and **fails when a declaration goes stale** as well as
      # when an undeclared one appears (`§O-286`, `§O-291`).
      - name: Verify the two gates run the same checkers, beyond the declared divergences
        run: python tools/check_gate_parity.py
      - name: Prove the parity check detects an undeclared, a stale and a misdirected divergence
        run: python tools/check_gate_parity.py --self-test

      # §10.2: "no metric label may take an unbounded value (no raw paths, no user IDs, no full
      # URLs). Enforced by a lint on metric definitions." The lint is this. It found three
      # unbounded maps in `HttpMetrics` on its first run (`§O-306`).
      - name: Verify every metric label is bounded
        run: python tools/check_metric_cardinality.py
      - name: Prove the cardinality lint refuses an unbounded key
        run: python tools/check_metric_cardinality.py --self-test

      # Twelve rounds of this goal have found controls that were written, tested and never called,
      # every one by grepping for callers. §O-311 found the mechanical cause: a `pub` item is
      # reachable from outside the crate, so `clippy`'s `dead_code` does not apply -- `pub` disabled
      # the one check that would have named it.
      #
      # The allowance is a DECLARATION -- `tools/public-reachability-allow.txt` names all 22 and
      # gives each a reason -- not a number, because a number says how many and nothing about which,
      # so a new item and a removed one cancel out. The checker FAILS ON A STALE ENTRY, the same rule
      # check_checklist_counts and check_gate_parity apply to their own declarations.
      - name: Verify no public item is unreachable and uncalled
        run: python tools/check_public_reachability.py
      - name: Prove the reachability check refuses an unreferenced `pub` in a private module
        run: python tools/check_public_reachability.py --self-test

      # `.coderabbit.yaml` decides what the external reviewer is shown and which
      # rules it is told to apply, which makes it a control -- and a control that
      # silently stops working is worse than one never added, because the review
      # still runs and still reports clean. The failure modes are all silent: the
      # file renamed (CodeRabbit reads only `.coderabbit.yaml`), a `path_filters`
      # entry excluding the source, or a `path_instructions` glob matching no file,
      # so the prose reads as an enforced rule while nothing enforces it.
      - name: Verify the external-review configuration is live and specific
        run: python tools/check_coderabbit_config.py
      - name: Prove the review-config check detects an inert configuration
        run: python tools/check_coderabbit_config.py --self-test

      # A docstring in `tools/` cited a Checklist item that does not exist -- the
      # `DX` series ends at `DX-020`, and the number cited was three digits past it.
      # It was invented, wrapped in a quotation so it read as a citation, and repeated
      # in a commit message. Nothing caught it: `check_xrefs.py` covers `§O-…`
      # references and had no reason to look at a `DX-` token. See Observations §O-126.
      - name: Verify every checklist identifier cited in code exists
        run: python tools/check_checklist_citations.py
      - name: Prove the citation check catches a fabricated identifier
        run: python tools/check_checklist_citations.py --self-test

      # The checklist's own arithmetic. Its header states a per-area count, a grand
      # total, and a per-phase table, and all three are prose a human edits. Measured
      # drift when this step was added: **fifteen** wrong numbers, including a grand
      # total three items short of the item count -- so the document disagreed with
      # itself about how much work the project contains. Nothing caught it, because
      # every other checker reads the *items* and none read the *summary*.
      #
      # The phase-to-area map is read from §2 rather than hard-coded, so adding an area
      # to a phase cannot silently exempt it.
      - name: Verify the checklist's own counts add up
        run: python tools/check_checklist_counts.py
      - name: Prove the count check catches a wrong total
        run: python tools/check_checklist_counts.py --self-test

        # `PLAN-003`'s shape applied to prose. `check_checklist_counts` counts items and
        # `check_doc_claims` resolves numerals -- **neither reads a sentence** -- so a `-> Done:` block
        # that repeats a substantial line, or a tick with no evidence, passed every gate. Both are
        # mechanical, and the second is a ratchet: the 53 items ticked before the convention existed are
        # listed by name, and a new one fails.
      - name: Verify no Done block repeats a line and every tick carries evidence
        run: python tools/check_done_lines.py
      - name: Prove the evidence check catches a duplicate line and a newly unevidenced tick
        run: python tools/check_done_lines.py --self-test

      # `PLAN-001`: the checklist as machine-readable data. The tracked `tools/backlog.json` is what a
      # consumer reads instead of re-parsing markdown, and this fails when it has drifted from the
      # document -- the same shape as `corpus_at_rest.json` and `gen_llms_txt.py --check`.
      - name: Verify the tracked backlog matches the checklist
        run: python tools/gen_backlog.py --check
      - name: Prove the backlog check catches drift and vacuity
        run: python tools/gen_backlog.py --self-test

      # `PLAN-003`: the Proposal states each milestone's deliverable in prose; `tools/milestones.json`
      # turns it into named items and this decides them. `--report` exits 0 by design -- most
      # milestones are not met. The executable form is `--milestone MX`, which a release invokes.
      - name: Report every milestone's real position
        run: python tools/check_milestones.py --report
      - name: Prove the milestone declaration is validated and the external gate holds
        run: python tools/check_milestones.py --self-test

      # §9.2 is a contract with twelve stated budgets. `Budget::ALL` in
      # `crates/qqq-bench/src/budget.rs` is its machine-readable copy, and this
      # compares the Proposal, that table and the checklist against each other.
      #
      # The failure it prevents is silent in both directions: a budget whose target
      # drifted from §9.2 still compares, still prints a verdict, and still says
      # MEETS -- against a number nobody agreed to.
      #
      # Writing this checker found three bugs in ITSELF on the first run (its
      # `--self-test` reported three of four injections as MISSED), including a
      # parser that read "60k RPS" as 60.0 and would have passed a system doing
      # sixty requests per second. Recorded in Observations §O-161.
      - name: Verify the §9.2 budget table against the Proposal and the checklist
        run: python tools/check_bench_contract.py
      - name: Prove the bench-contract check catches a drifted budget
        run: python tools/check_bench_contract.py --self-test

      # ARCH-011's defect was not a wrong number but the SAME number written in
      # three places, which drifted: the module doc comment, the checklist entry,
      # and the `STAGES` table each stated a different set. Two earlier rounds
      # "fixed" it by correcting the numbers, which is how it came back.
      #
      # The fix is one counting site -- `Summary::of` delegates to `Counts::of` --
      # and the in-file test `the_documented_counts_match_the_table` asserts the
      # module's prose against that fold. What a test inside `qqq-serve` cannot do
      # is read the checklist, which lives two directories up; this step closes
      # that half from the same source of truth. Observations §O-244.
      - name: Verify every stated STAGES count is the count the table produces
        run: python tools/check_lifecycle_counts.py
      - name: Prove the lifecycle-count check catches a hand-written count
        run: python tools/check_lifecycle_counts.py --self-test

      # The crate topology is a stated invariant -- "no crate may depend on a
      # crate above it in this list" -- and until this check existed it was
      # enforced by nothing but attention. Two violations had accumulated: the
      # table listed qqq-host above qqq-abi and qqq-run above qqq-pkg, both of
      # which are impossible, because the linker is built *from* the interface
      # registry and the CLI resolves dependencies *via* the package manager.
      #
      # Also asserts that qqq-core, which every other crate depends on, has no
      # I/O -- with a control proving the rule is wired, so it cannot pass
      # forever by being misconfigured.
      - name: Verify the crate topology
        run: python tools/check_topology.py

      # ARCH-010: every crate's declared stability tier, checked against Proposal
      # §4.3. `check_topology.py` above verifies the *order* of §4.3's table; this
      # verifies the tier each crate promises. Nothing compared them until this
      # check existed, so a crate could be switched from beta to stable in its
      # manifest -- the line a publisher reads before making a semver promise --
      # with every gate green and the specification saying the opposite.
      #
      # Its first run found a real divergence in both directions: `qqq-bench` and
      # `qqq-sys` are built and carry a tier but have no row in §4.3's table,
      # while `qqq-registry` and `qqq-fabric` have rows and are not built here.
      # Both classes are reported on every run rather than tolerated silently.
      - name: Verify the crate stability tiers (ARCH-010)
        run: python tools/check_tiers.py
      - name: prove the tier check and its parsers are live
        run: python tools/check_tiers.py --self-test

      # A validator that cannot fail manufactures false confidence. This harness
      # deliberately breaks the corpus and asserts each injection is caught; it
      # prints the count it achieved, so the number is never restated here where
      # it could go stale. See Observations §M-006.
      - name: Prove the validator actually detects breakage
        run: python tools/self_test_xrefs.py

      # **Run the validator again, after the mutating harness.**
      #
      # This harness rewrites three documents and restores them. A kill it cannot
      # catch (`SIGKILL` -- a CI timeout, a cancelled job) leaves an injection
      # applied, and the corpus then contains text no human wrote. The step above
      # would still report its own success, because the injections it applied *were*
      # detected; the damage only shows up later, as a confusing validator failure
      # that reads like real document drift.
      #
      # That is not hypothetical: a leftover `§99.9` marker in the checklist once
      # produced a "the documents have drifted" diagnosis that pointed at three
      # correct documents.
      #
      # The harness now also self-heals -- it detects its own leftovers, reverses
      # the exact substitution, and verifies the repair -- and this step is the
      # independent confirmation that the corpus is internally consistent *after*
      # everything that touches it has run.
      - name: Confirm the corpus survived the harness
        run: python tools/check_xrefs.py

      # **A digest barrier, because every marker scan above asks a narrower question.**
      #
      # `--check-clean` and `check_xrefs.py` both ask "is a *known* fault text
      # present?". A digest asks "are these the bytes we agreed on?", which needs no
      # marker list and catches a fault nobody has thought of.
      #
      # The failure it closes is `§O-204`: the harness mutates a document, proves the
      # validator, and restores it, all within one run. A commit built from an index
      # captured inside that window records the *injected* bytes while the working
      # tree, `git status` and `--check-clean` all look correct. That happened --
      # `0a9e2eb` carried `HOST-999` (not-a-checklist-item) in the Proposal and was
      # amended before pushing.
      #
      # Recording and verifying in the same job makes the barrier self-checking on
      # every run: if the corpus is left changed by anything at all, this step names
      # the document and the byte-length delta.
      - name: Prove the corpus is byte-identical to its recorded digests
        # Verified against the **committed** digest file. `--record` is
        # deliberately absent: it rewrites the digests from the tree, so a job
        # that recorded and then verified would compare the tree to itself and
        # pass on any corpus. The committed `tools/corpus_at_rest.json` is the
        # authority; regenerating it is a deliberate local act whose diff is
        # reviewed, which is the only way the barrier can mean anything.
        run: |
          python tools/check_corpus_at_rest.py

      # `HOST-011` requires every host function to be panic-guarded, and the
      # guard is a *wrapper*: a host function added without it compiles, passes
      # every test that does not panic, and kills the process (the release
      # profile sets `panic = "abort"`) the first time a guest finds the
      # panicking path. No runtime test can enforce that, so the rule is checked
      # at the source level -- and a source-level check is worth exactly as much
      # as its ability to fail. This harness removes one guard, asserts the check
      # goes red with the right message, and restores the file.
      #
      # It deliberately refuses to report success when the injected source fails
      # to *compile*: an injection that does not build proves nothing about the
      # check, which is the failure mode Observations §O-048c records.
      # **A FAULT-INJECTION CHECKER MODIFIES THE TREE ON PURPOSE.** `02903b7` -- a commit about the
      # MCP server -- deleted a `@since` line from `wit/qqq-clock.wit`, because the gate had run
      # `fault_inject_wit_since` (whose INJECTION IS "remove the @since annotation") and `git add -A`
      # took the injected state. **One missing annotation then failed three checkers.**
      #
      # So the tree is snapshotted before the fault injectors and verified after them. Two file reads,
      # and it catches ANY checker that moves the tree rather than only the fault injectors.
      - name: Snapshot the tree before the fault injectors
        run: python tools/check_fault_inject_restores.py --snapshot

      - name: Prove the panic-guard check detects an unguarded host function
        run: python tools/fault_inject_guard.py

      # `ARCH-002`, `ARCH-004` and `ARCH-008` are statements about the
      # *workspace* -- that no crate depends upward, that every crate except the
      # named exceptions forbids `unsafe`, and that no widening primitive exists
      # on `GrantSet`. Each test asserts an ABSENCE, and an absence is trivially
      # satisfied by a scanner that finds nothing, so this harness injects three
      # real violations -- a valid upward dependency, a bare `allow(unsafe_code)`
      # and a `fn union(` on `GrantSet` -- and asserts each makes its own test go
      # red.
      #
      # Every injection must be valid Rust or valid TOML. An injection that
      # breaks the build (for instance by creating a dependency CYCLE rather
      # than merely an upward edge) proves nothing about the check, and the
      # harness reports that case separately as BROKEN rather than as DETECTED.
      - name: Prove the architecture tests detect real violations
        run: python tools/fault_inject_architecture.py

      # `ARCH-009` + §4.3 require every `unsafe`-permitting crate to carry a
      # written safety argument. Exactly one of the four combinations of
      # (`SAFETY.md` present, `unsafe` forbidden) is a violation -- `unsafe`
      # permitted with nothing written down -- and the other three are all
      # legitimate points in the process, including the argument written AHEAD
      # of the code. This harness injects the one violating state and asserts the
      # check fires; injecting either of the legitimate ones would report a false
      # failure and teach the next person to weaken the test.
      - name: Prove the safety-argument check detects an unwritten exception
        run: python tools/fault_inject_safety_arg.py

      # The naming invariant is the project's PUBLIC INSTALL SURFACE. §D-001
      # settles it -- brand QQQ, crate/npm/binary/command all `qqqai`, because
      # `qqq` is taken on crates.io and npm -- and calls it permanent rather than
      # a workaround awaiting a better option. A rename is otherwise discovered by
      # users running `cargo install qqq`, not by CI.
      #
      # This harness injects three realistic ways the rule breaks: a `[[bin]]`
      # renamed to `qqq`, a document teaching `qqq new`, and a package renamed to
      # the taken name. All three must be caught.
      - name: Prove the naming check detects a `qqq` binary
        run: python tools/fault_inject_naming.py

      # The `xrefs` job's half of the pair. **A runner's TEMP is not shared**, so each job that runs a
      # fault injector needs its OWN snapshot and verify.
      - name: Verify the fault injectors returned the tree (xrefs)
        run: python tools/check_fault_inject_restores.py --verify

      # The objective audit: does the deliverable set actually satisfy the
      # brief? It checks that all three documents exist and are English, that
      # the Proposal covers the required sections, that the Checklist is fully
      # anchored, and that every machine check passes.
      #
      # It also runs the two validators above, so this is partly redundant with
      # them -- deliberately. This is the check a reader runs to answer "is the
      # objective met?", and it must be answerable from the repository alone
      # rather than by assembling a sequence of commands from a document.
      - name: Objective requirement audit
        run: python tools/audit_requirements.py

  # ---------------------------------------------------------------------------
  # WIT: the interface definitions must actually parse.
  #
  # The Rust tests in qqq-abi check that the registry and the .wit files agree
  # structurally -- every capability maps to exactly one interface, names are
  # versioned, source is present. They CANNOT tell whether a file is valid WIT.
  # The first draft of all thirteen files passed every Rust test while being
  # rejected outright by wasm-tools. This job closes that gap.
  # ---------------------------------------------------------------------------
  wit:
    name: WIT interface validation
    runs-on: ubuntu-latest
    # 25 min, from a measured 2.1 on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@wasm-tools
      - name: Validate every interface with wasm-tools
        run: python tools/check_wit.py

      # `§O-354`: this checker had **no demonstrated failure mode in either gate** -- not a
      # `--self-test`, not a `fault_inject_*.py` harness. `tools/check_conformance.py` found it by
      # requiring every conformance obligation's checker to prove it can fail, which is a question
      # `check_gate_parity.py` does not ask: a checker can be in both gates and still be one
      # nobody has watched fail.
      #
      # The injected defect is the subtle one -- one missing semicolon, which every structural
      # assertion in `qqq-abi` accepts and only a parser rejects. That is the gap `check_wit.py`
      # exists to close, so it is the gap the self-test injects. The valid half is asserted too,
      # because a checker that rejects everything would also "detect" it.
      - name: Prove the WIT validator rejects a one-character defect
        run: python tools/check_wit.py --self-test

      # `TEST-010`: the cross-language conformance fixture, its parity matrix, and the rule that
      # every gap carries an owner and a date (Proposal §6.10). It also requires each obligation's
      # checker to be invoked in BOTH gates, so it is a check on the gates as well as the fixture.
      - name: Check the conformance fixture
        run: python tools/check_conformance.py
      - name: Print the language parity matrix
        run: python tools/check_conformance.py --matrix
      - name: Prove the conformance checker rejects an unowned gap and a drifting status
        run: python tools/check_conformance.py --self-test

      # `§O-415`: source module docs state which checklist items they implement, and nothing
      # compared that to `tools/backlog.json`. Both forms are identical to `docker/entrypoint.sh`
      # because `check_gate_parity.py` compares invocations rather than scripts.
      - name: Compare the source files' checklist claims against the backlog
        run: python tools/check_source_claims.py --check
      - name: Prove the source-claims checker rejects a total claim and accepts a scoped one
        run: python tools/check_source_claims.py --self-test

      # `check_wit.py` above proves each file PARSES. It cannot prove the
      # annotation policy is followed, and that was verified rather than
      # assumed: `wasm-tools` accepts a WIT file with no `@since` at all and
      # exits 0. NN-5 in the Proposal makes the annotation mandatory, so the
      # contract needs its own check -- a parser proves the language, this
      # proves the contract.
      - name: Validate the WIT versioning policy (CON-007 / CON-008)
        run: python tools/check_wit_since.py

      # And prove that check can fail. Three injections, all of which leave the
      # file PARSEABLE -- including one where a `@since` is moved onto a `use`
      # line and silently annotates the wrong item. That case is why a parser is
      # not sufficient, and the harness refuses to count a detection whose input
      # did not parse.
      #
      # Note the deliberate omission: "`@since` above the package version" is
      # NOT injected, because `wasm-tools` already rejects it and no parseable
      # file triggers our rule. The checker keeps the rule as defence in depth,
      # and the harness says so rather than implying it is exercised.
      # The `wit` job's half of the pair. **This is the step that was in the WRONG JOB**: `--snapshot`
      # ran in `xrefs` and `--verify` here, on a different runner, and CI failed every commit since with
      # `GATE TREE INCONCLUSIVE -- no snapshot`.
      - name: Snapshot the tree before the fault injectors (wit)
        run: python tools/check_fault_inject_restores.py --snapshot

      - name: Prove the versioning check detects a missing `@since`
        run: python tools/fault_inject_wit_since.py

      # `CON-009`: every FALLIBLE host call returns a typed error rather than a
      # status code buried in a payload (§2.5, NN-5). The rule is about fallible
      # calls, so the check cannot be "every function returns `result`" --
      # `clock.timezone` genuinely cannot fail while `crypto.decrypt` can. It is
      # therefore "every fallible function returns `result<T, E>`, AND every
      # infallible one is named in an allowlist with the category that makes it
      # infallible" -- which turns "this cannot fail" from an omission into a
      # written claim. 73 functions checked, 19 declared infallible by name.
      #
      # It also rejects `result<T, string>`: the rule's second half requires a
      # NAMED variant, so a caller in any language gets an exhaustive match
      # rather than an integer to compare against constants.
      - name: Validate the typed-error rule (CON-009)
        run: python tools/check_wit_errors.py

      # And prove it can fail, with three injections -- a fallible function with
      # no error type, a primitive error type, and a stale allowlist entry. Every
      # injection leaves the file PARSEABLE, because one that breaks the parser
      # proves nothing about this checker.
      - name: Prove the typed-error check detects violations
        run: python tools/fault_inject_wit_errors.py

      # §2.5 forbids hidden global state in the runtime: no environment-variable
      # reads, no CWD dependencies, no implicit config discovery. A SOURCE check
      # rather than a runtime test, because the violation is an absence of
      # discipline in code no test exercises -- a host interface reading
      # `QQQ_CONFIG` on a path nobody tests behaves identically to a correct one
      # under every test that does not set it.
      #
      # `std::env::consts::*` is allowed: those are compile-time constants of the
      # BUILD, not of the running environment. Two exemptions are named in the
      # tool with their justifications, and they are scoped to
      # (file, construct) rather than to the file -- so the exempted `var_os` in
      # `RealEnv` does not blanket-cover a bare `var` beside it.
      - name: Validate no hidden global state (CON-010 / CON-018)
        run: python tools/check_no_ambient.py

      - name: Prove the ambient-state check detects violations
        run: python tools/fault_inject_no_ambient.py

      # §8.3: "CI fails if it drifts from the implementation." Three surfaces
      # have a machine-readable contract derived from Rust types -- `qqq.toml`,
      # `qqq.lock` and the CLI envelope -- and they are published under
      # `schema/`. Regenerating is a separate command; CI only checks.
      #
      # The check is paired with its self-test for the reason this workspace has
      # recorded five times: a checker that has never been shown to fail might
      # always pass. The six injections break the generator's INPUTS (an added
      # field, an unknown type, a stripped `as_str`, emptied sources) and its
      # OUTPUTS (a deleted schema, a hand-edited one) separately, and injection 6
      # is the anti-vacuity case -- emptied sources must fail rather than emit a
      # schema with `"properties": {}`, which would describe every possible
      # document (CON-016).
      - name: Validate published schemas match the implementation (CON-016)
        run: python tools/gen_schemas.py --check

      - name: Prove the schema-drift check detects drift
        run: python tools/self_test_schemas.py

      # §8.5: "llms.txt at repo root and docs site — curated index of what to
      # read, in what order" and "llms-full.txt — full documentation concatenated
      # for context loading". Generated rather than hand-written, so the index
      # cannot describe a file that is not there and a new document cannot go
      # unlisted.
      #
      # One exclusion in that generator is a SECURITY control rather than a
      # judgement: `docs/.env` holds credentials, and an index linking to it, or a
      # corpus embedding it, would be a leak into a file designed to be pasted
      # into a model's context window.
      - name: Validate the llms.txt index and corpus (DOC-020)
        run: python tools/gen_llms_txt.py --check

      - name: Prove the llms.txt check detects drift and a stale exclusion
        run: python tools/gen_llms_txt.py --self-test

      # §4.5: "a host interface that would naturally be called in a loop must
      # instead accept a batch" (CON-012). The operative phrase is a judgement
      # about usage, which NO checker can make -- so this checks the decidable
      # half: every DECLARED batch pair must be real, must actually take a
      # collection, and must agree with its singular form on the error type.
      #
      # It deliberately does not demand a batch form for every singular function.
      # An earlier version did, and produced 23 demanded classifications
      # including `sql.txn.commit` and `trace.span.event` -- operations that are
      # inherently singular. A tool demanding a written excuse for each of those
      # generates paperwork, and paperwork gets allow-ed away.
      - name: Validate the batch-first rule where it is decidable (CON-012)
        run: python tools/check_batch_first.py

      - name: Prove the batch-first check detects pair defects
        run: python tools/fault_inject_batch_first.py

      # And the tree must be back. **This is the step that would have caught `02903b7` before it was
      # pushed**, and it is cheap because it compares digests rather than re-running anything.
      - name: Verify the fault injectors returned the tree (wit)
        run: python tools/check_fault_inject_restores.py --verify
      - name: Prove the restore check catches a checker that does not restore
        run: python tools/check_fault_inject_restores.py --self-test

  # ---------------------------------------------------------------------------
  # Rust: format, lints, build, test.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 45 min, from a measured 5.2 ubuntu / 6.5 macos / 9.8 windows on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        # **`@master` requires an explicit `toolchain:` input.**
        #
        # This step read `dtolnay/rust-toolchain@stable`, which names whatever
        # `stable` is on the day the job runs -- a moving target that silently
        # diverged from the toolchain on a developer's machine. It cost three red
        # CI runs: `chunks_exact` with a constant chunk size is a lint added in
        # 1.98, the local toolchain was 1.97.1, and a commit that passed
        # `clippy -- -D warnings` three times locally was rejected on all three
        # Rust platforms (Observations §O-121).
        #
        # The first fix -- `@master` with no `toolchain:` input, on the belief that
        # it would read `rust-toolchain.toml` -- failed on every platform with
        # `'toolchain' is a required input`. The action's *branch name* is the
        # version; `@master` does not infer one. So the channel is written out
        # here, and `rust-toolchain.toml` carries the same number for local use.
        # The two must be changed together, which is a real cost and the honest
        # one: an action input cannot reference a file.
        #
        # The rule that came out of all of this: **reproduce the exact command CI
        # runs, in the environment CI runs it in.** A command is not the whole
        # specification; the toolchain version is part of it.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --workspace --all-features --verbose

      - name: test
        # **This is the step that hung.** `d2fea05`'s ubuntu job sat here for 70+ minutes
        # and the run never finished; a warm run is ~3-4 min. Bounded so a hang fails the
        # step by name in 30 minutes rather than the job in six hours (`§O-355`).
        timeout-minutes: 30
        run: cargo test --workspace --all-features --verbose

      # `LANG-001` -- "`wasm32-wasip2` build path, **verified end to end**".
      #
      # # Why it is a separate step rather than part of the step above
      #
      # Because it **compiles a guest**. That needs the `wasm32-wasip2` target installed and
      # takes seconds, so the test carries `#[ignore]` and this step is how the gate asks for
      # it. The alternative -- letting it run in the default set -- would make every
      # developer's `cargo test` depend on an installed target, and a test that cannot run
      # everywhere must *say so* rather than fail everywhere.
      #
      # # What it proves that no other step does
      #
      # The `reference-app` job builds the guest with `cargo build` directly and inspects the
      # artifact with `wasm-tools`. This drives the **product's own command** (`qqqai build`)
      # and asserts the artifact's **eight-byte preamble** is the component-model encoding,
      # `0d 00 01 00`, rather than a core module's `01 00 00 00`.
      #
      # That distinction is the whole point: **a core module carries the same `\0asm` magic
      # as a component**, so a test asserting `\0asm` passes on exactly the failure
      # `LANG-001` exists to catch.
      #
      # # Why all three platforms, at a cost of one guest build each
      #
      # `DIST-020` asks whether Windows is first-class or best-effort, and the
      # platform-dependent part of this path is the toolchain probe and the artifact-path
      # computation behind `qqqai build`. Running this on Linux alone would answer that
      # question with silence. The incremental compile cost is near zero: the step above has
      # already built these test targets in the same profile and feature set.
      # # `qqqai build` HAS A PREREQUISITE, AND THIS JOB DID NOT HAVE IT
      #
      # The first version of the step below **failed on ubuntu and macos**, and the reason is
      # the most useful thing this item produced:
      #
      #     error[QQQ-1003]: missing a tool required for a `rust` build
      #       caused by: missing:
      #       wasm-tools (validates that the output is a component, not a core module
      #                   -- install with `cargo install wasm-tools`)
      #
      # `qqqai build` **requires `wasm-tools`** -- `crates/qqq-run/src/build.rs` declares it as a
      # `ToolRequirement` for a rust build, because the build *validates that its own output is a
      # component rather than a core module*. The product reports that correctly, with a
      # remediation line; the job simply never installed the tool. `wit` and `reference-app`
      # install it, and `rust` did not.
      #
      # **The local run was green because this machine has `wasm-tools` 1.259.0.** A green that
      # depends on what happens to be installed is not a green (`§O-355`), and the rule it breaks
      # is `§O-121`'s: reproduce the exact command, **in the environment CI runs it in**. The
      # prerequisite was declared in the product and invisible in the job.
      #
      # The same action `wit` and `reference-app` use, rather than `cargo install`: it is pinned,
      # cached, and it FAILS when the tool cannot be obtained -- a `|| true` here would turn the
      # step into the vacuity this repository records more often than any other.
      - uses: taiki-e/install-action@wasm-tools

      - name: Live dev replacement and CLI AOT output
        timeout-minutes: 10
        run: python tools/check_live_dev.py

      - name: the wasm32-wasip2 build path produces a component (LANG-001)
        # Bounded, from the rule that cost a 360-minute run once: a hang must fail a named
        # step rather than the whole job (`§O-355`).
        timeout-minutes: 10
        run: cargo test -p qqq-run --all-features --test lang001_rust_guest -- --ignored

      # `LANG-002` -- "Rust bindings generated from `wit/` via `wit-bindgen`".
      #
      # # What it found the first time it ran
      #
      # The test vendors **every** `wit/*.wit` into a probe and builds it with the pinned
      # `wit-bindgen`. It failed:
      #
      #     invalid character in identifier '2'
      #        --> ...\wit\deps\qqq-crypto\qqq-crypto.wit:118:5
      #         |     aes-256-gcm,
      #
      # **`wit-bindgen` could not generate bindings from the canonical `wit/` at all.** The pin was
      # `0.44`, whose `wit-parser` is 0.236.1, which requires every hyphen-separated segment of an
      # identifier to start with a letter -- and the grammar was later relaxed to allow exactly
      # that. `wit-bindgen` 0.62 (whose `wit-parser` is 0.259.0) accepts it.
      #
      # # The part worth keeping
      #
      # `tools/check_wit.py` validates `wit/` with `wasm-tools`, and it has always been **green** --
      # `wasm-tools 1.259.0` bundles `wit-parser` 0.259.0. So the repository's WIT validator and
      # its guest toolchain were parsing the same files with **different grammars**, and only one
      # of them was on the critical path. **A guard that uses a different parser than the consumer
      # measures a different language** (`§O-282`, one level up: not too narrow a file list, but
      # too permissive a grammar).
      #
      # # Why it is a step and not part of the workspace tests
      #
      # Because it **compiles two guests**: the probe, and then the same probe with one deliberately
      # unparseable interface, to prove the first build can fail. The `wasm-tools` install above is
      # its prerequisite too -- the test reads the artifact's import table through
      # `qqqai inspect`.
      #
      # The budget is 15 minutes against a measured ~25 s locally, because CI builds the probe's
      # whole dependency tree from cold: the guest's `target/` is not in this job's cache.
      - name: every canonical interface binds with the pinned wit-bindgen (LANG-002)
        timeout-minutes: 15
        run: cargo test -p qqq-run --all-features --test lang002_bindings -- --ignored

      # `LANG-003` -- "Rust project template with tests and CI".
      #
      # # What the scaffold produced, measured
      #
      # Six files, **no `wit/` tree**, and a source that defined its own `Request`/`Response`
      # without implementing the world's export. `qqqai build` succeeded on it, and the artifact was
      # a component that exported **nothing**:
      #
      #     $ wasm-tools component wit target/qqq/probe-app.component.wasm
      #     package root:component;
      #     world root {
      #     }
      #
      # **A QQQ app is a component that exports `qqq:http/incoming-handler`.** One that exports
      # nothing is a wasm module that happens to compile, and `qqqai serve` has nothing to call.
      # The template's own comment said the ABI export was *"tracked separately"* (`§O-362`).
      #
      # It also shipped **no CI**, which is the other half of the item.
      #
      # # What this step runs
      #
      # The test scaffolds a project, runs the scaffold's **own CI steps** on it -- `cargo fmt
      # --check`, `cargo clippy -D warnings`, `cargo test` -- and then asserts through `qqqai build`
      # and `wasm-tools` that the artifact **exports** the handler. Running the scaffold's CI steps
      # here is the difference between shipping a workflow and shipping a workflow that passes.
      #
      # The `wasm-tools` install above is its prerequisite too.
      #
      # # Why the budget is 20 minutes against a measured ~73 s locally
      #
      # Because the test drives **four** `cargo` invocations inside a project whose `target/` is in
      # a temporary directory, so CI builds the scaffolded project's dependency tree from cold on
      # every run. The local number is warm.
      - name: a scaffolded project is a servable application that passes its own CI (LANG-003)
        timeout-minutes: 20
        run: cargo test -p qqq-run --all-features --test lang003_template -- --ignored

      # `TEST-016`. `conformance/suite.json` defines obligations and `check_conformance.py` proves
      # each one's checker runs in both gates -- which is all about the FIXTURE. None of it runs a
      # case against a built guest, so `LANG-004` (*"Rust conformance-suite pass"*) had nothing to
      # pass. This is the execution half: it builds the reference guest and runs every case the
      # fixture marks `kind: execution` against the runtime's own reading of the artifact.
      #
      # # Why it runs here rather than in the checker job
      #
      # It drives `qqqai build` and `qqqai inspect`, so it needs the binary and the guest toolchain.
      # The checker job has neither. Its **fast** half -- the guard that fails when the fixture
      # declares an execution case nothing implements -- is *not* ignored, so it also runs in the
      # workspace suite on every platform; only this half, which compiles a guest, is `--ignored`.
      - name: every conformance execution case passes against the Rust guest (TEST-016)
        timeout-minutes: 20
        run: cargo test -p qqq-run --all-features --test conformance_exec -- --ignored
      # TEST-016, the other half: the suite as an INDEPENDENTLY USABLE TOOL. The test above runs
      # it from inside the crate that owns the fixture; this runs it against a guest path the
      # caller names, which is what DOD-001 needs for the other four languages. Both read the
      # assertion from `conformance/suite.json`, so they cannot drift.
      - name: the conformance suite runs as a tool, not only as a test (TEST-016)
        run: |
          # No shell redirect: `--list` prints two lines, and `> /dev/null` is a POSIX-ism
          # that the local gate's ci.yml mirror -- which replays these commands under cmd.exe --
          # cannot honour. A command that is green in CI and red locally is a divergence.
          python tools/run_conformance.py
          python tools/run_conformance.py --self-test
          python tools/run_conformance.py --list

      # `LANG-005` -- the Rust reference application, and the one claim in it that was false.
      #
      # # What was measured
      #
      # `examples/orders-api/qqq.toml` said *"every stanza below is load-bearing, and a reader can
      # check that claim by deleting one and watching a route fail."* It was false for two of the
      # three capability stanzas:
      #
      #     $ qqqai caps --manifest examples/orders-api/qqq.toml --json
      #     data.grants = ["clock.monotonic", "http.server", "crypto.hash"]     3 GRANTED
      #
      #     $ qqqai inspect examples/orders-api/target/qqq/orders-api.component.wasm
      #     required capabilities: http.server                                  1 IMPORTED
      #
      # `crypto.hash` was declared for a SHA-256 the app implements in-tree, and `clock.monotonic`
      # for a clock no workload reads.
      #
      # # Why that matters more here than anywhere else
      #
      # **An inert grant is an over-grant.** The linker is built from the grant set alone -- the
      # model is *absent, not denied* -- so a capability the guest cannot exercise is one it should
      # not hold. And `examples/orders-api` is the file a reader is invited to copy, so it is the
      # worst place to teach "grant a few extra, they are harmless".
      #
      # This step asserts the two sets are **EQUAL in both directions**: an import with no grant is
      # a guest reaching past the model, and a grant with no import is a capability granted for
      # nothing. Both are read through the product's own surfaces, so the assertion is about what
      # QQQ resolves rather than about what the TOML appears to say.
      #
      # The `wasm-tools` install above is its prerequisite: `qqqai build` needs it.
      - name: the reference application grants exactly what it imports (LANG-005)
        timeout-minutes: 15
        run: cargo test -p qqq-run --all-features --test lang005_reference_app -- --ignored

      # `DX-004`. §12.2 fixes five parts to every error message, and the two existing
      # checks cover the *catalogue* (every code has a cause and a remediation line) and the
      # *schema* (`error.docs_url` exists). Neither reads a message a user receives, so a
      # complete catalogue entry can still be dropped by the renderer -- `§O-225`'s shape.
      #
      # This drives the binary built above and holds real errors to all five parts in both
      # the human and `--json` forms. It sits here rather than in the checker job because its
      # subject is a built binary, and the checker job has none.
      - name: every error meets the §12.2 standard (DX-004)
        run: python tools/check_error_standard.py
      - name: prove the error-standard check fires
        run: python tools/check_error_standard.py --self-test

      # `CON-001`/`CON-016`. `schema/*.schema.json` is generated from the Rust types and
      # drift-checked, which proves the document matches the *generator* -- and says nothing about
      # whether the generator read the source. It did not, three times, in one struct:
      # `dev_dependencies` for `dev-dependencies`, `generated_by` for `generated-by`, and
      # `lockfile_hash` for `lockfile-hash` -- one of them also listed as REQUIRED, so the
      # published schema rejected a manifest the parser accepts. Every one passed `--check`,
      # because `--check` compares the schema against the generator's own misreading.
      #
      # It sits here for the same reason DX-004 does: its self-test injects into the source and
      # then rebuilds the binary, and the checker job has no Rust.
      - name: the published schemas agree with the Rust source (CON-001)
        run: python tools/check_schema_conformance.py
      - name: prove the schema-conformance rules are live
        run: python tools/check_schema_conformance.py --self-test

      # `DX-015`. §12.3 commits to *"every public API has a compiling example"* at 100%, and
      # the measured state was **2116 public declarations and 3 doctests running**. A check
      # demanding 2113 new examples in one commit would be red forever and ignored, so this
      # is a **ratchet**: `--allow` is the visible distance to the target, and the number below
      # is lowered as examples land. A regression -- an example lost -- fails immediately,
      # which is the part CI can meaningfully block.
      #
      # **This number must be lowered, never raised.** Raising it records a step backwards.
      #
      # # Why it is 2109 and not 2121
      #
      # The checker's own contract states that `--allow` "is set in `ci.yml` to the current
      # count". At `c46de27`, where 2107 was written, the count was exactly 2107 and the gate
      # was green. Four later commits added public declarations without examples and did not
      # move this number, so the ratchet was left stale: measured at `c8d1c1e` the count is
      # 2119, and 2121 after this goal's new public items.
      #
      # That drift was **invisible**, because this step runs in the `rust` job after the
      # `rustfmt` step, and `rustfmt` had been failing since `c8d1c1e`. Every step below it
      # was skipped, so a red gate read as green. The correction is a catch-up to the
      # measured count, not a raising of the target: the target remains 0, and the distance
      # to it is now stated honestly rather than understated. Observations §O-247.
      #
      # # And why it went DOWN, to 2108
      #
      # Because the denominator was wrong. `items_in` scans text, so a `pub` declaration inside a
      # **string literal or a comment** was counted as this crate's public API. Measured: **14**
      # such declarations, twelve of them the scaffold templates' own `pub` items in
      # `qqq-run/src/new.rs` and two a doc comment in `qqq-host/src/arch012.rs` quoting
      # `pub const NAME: &str`.
      #
      # `mask_source` blanks string literals and comments before the scan, so **2163** declarations
      # are counted instead of 2177, and **2108** are outstanding instead of 2122. That is a
      # **lowering** of the allowance, which is the direction the rule requires -- and the count is
      # now independent of what the templates contain, which it should always have been (`§O-362`).
      #
      # Both numbers are read from the tool: `python tools/check_api_examples.py --allow 3000`
      # prints the table and the pair, and `--self-test` proves the counters behind them.
      - name: public-API example coverage (DX-015)
        run: python tools/check_api_examples.py --allow 2105
      - name: prove the API-example counters and gate are live
        run: python tools/check_api_examples.py --self-test

      # `DOC-018`. §2.6 asks for a job that "fails if the docs describe an API that no longer
      # exists". The five generated documents already have generators with `--check` halves; this
      # covers the **hand-written** ones, where a count asserted beside a tool that re-derives it
      # drifted four times in one working period (`docs/unsafe-audit.md`: 141->142->143->146->147).
      #
      # A claim is opt-in and names a **resolver** rather than a number, so the document says
      # *which fact* it asserts and a number in prose that is not a claim is left alone.
      - name: documents assert counts the tree still matches (DOC-018)
        run: python tools/check_doc_claims.py
      - name: prove the doc-claim scanner and resolvers are live
        run: python tools/check_doc_claims.py --self-test
      # AGENT-024. The catalogue is checked for documentation completeness -- every code has a
      # cause and a remediation. NOTHING checked that a code can be PRODUCED, and this is what
      # found that ten of the 43 are emitted by nothing in the tree. The `cli` half runs the
      # reproducers; the static half needs only the tree and always runs.
      - name: every error code is classified, and the runnable ones are run (AGENT-024)
        run: python tools/check_agent_cookbook.py
      - name: prove the cookbook classifier and its negative predicate are live
        run: python tools/check_agent_cookbook.py --self-test
      # AGENT-023. §2.1's measurement: a cold-start agent must produce a working QQQ service.
      # The task set is checked in BOTH directions -- each task's verifier must FAIL on its
      # starting point and PASS on its reference solution -- so a task that cannot tell solved
      # from unsolved is reported as a defect in the TASK rather than as somebody's score.
      - name: the agent benchmark's task set is solvable and falsifiable (AGENT-023)
        run: python tools/check_agent_bench.py
      - name: prove the benchmark's task set and the two Proposal thresholds are live
        run: python tools/check_agent_bench.py --self-test

      # `§O-364`. `include_str!` is a **compile-time dependency on a file**, and the production
      # image copies an allowlist. The scaffold embedded `rust-toolchain.toml`, the file was not on
      # that list, and `Production image (SEC-029)` was the only red job of the twelve in run
      # `36326245198` -- while fmt, clippy, the workspace suite and this whole gate were green
      # locally, because on the developer's machine the file exists. This makes the class
      # impossible rather than closing it with one more `COPY` line, which is how the `wit/`
      # instance and the crate-stub list were each closed before it.
      - name: every include_str! resolves inside the production image's COPY set
        run: python tools/check_include_str.py
      - name: prove the include_str! check fires
        run: python tools/check_include_str.py --self-test

      # `§O-268`. A `subprocess` call that decodes with the *locale's* encoding: on a default
      # Windows console that is cp1252, so a child emitting UTF-8 kills subprocess's reader thread,
      # `stdout` comes back **empty**, and the caller reads "no output" as a real result. It
      # produced a false hand-off failure from the one tool whose job is to say whether a hand-off
      # is safe -- and it passes in CI, which runs on a UTF-8 locale, so nothing here saw it.
      #
      # `§O-292` recorded this checker as *"registered in both gates"*. It was registered in
      # **neither**; `check_gate_parity.py`'s rule 5 is what now refuses to allow that.
      - name: no subprocess call decodes with the locale's encoding
        run: python tools/check_subprocess_encoding.py
      - name: prove the encoding scanner and its exemptions are live
        run: python tools/check_subprocess_encoding.py --self-test

      # §12.3's DX-commitments table is titled "measurable, in CI", and its row
      # is `qqqai --help` for any command <= 40 lines. The unit test asserts it,
      # but a number buried in test output is not *measured* in the sense the
      # table means -- so this prints the count as its own CI step, where a
      # reviewer sees it.
      #
      # Measured before this step existed: 53 lines. After: 39.
      - name: the --help brevity standard (DX-013)
        shell: bash
        run: |
          set -euo pipefail
          BIN=./target/debug/qqqai

          # # Why this measures a PIPE rather than a shell variable
          #
          # The first version did `HELP="$(./target/debug/qqqai --help)"` and then
          # counted lines in `$HELP`. Measured while building the step: a 1890-byte
          # help output containing a UTF-8 em-dash yields **`len=0`** under some
          # bash builds -- command substitution silently drops the value, and
          # setting `LANG`/`LC_ALL` to `C.UTF-8` did not change it.
          #
          # The consequence would have been the worst kind. `LINES` would be empty,
          # `[ "" -gt 40 ]` would not be true, and the budget assertion would
          # **pass vacuously** -- the failure class this project has recorded six
          # times (`M-006`, `O-092`, `O-103`, `O-108`, `O-111`, `O-115`).
          #
          # So the step never holds the text. It counts lines in a pipe and greps a
          # pipe. Verified: `sh wrapper | wc -l` returns **39** on the same machine
          # where `HELP="$(cat file)"` returned length 0.
          LINES="$("$BIN" --help | wc -l | tr -d ' ')"

          # The anti-vacuity guard is kept even though the pipeline makes the
          # failure unlikely, because it is what turns "the measurement did not
          # happen" into a hard failure rather than a comparison against nothing.
          case "$LINES" in
            ''|*[!0-9]*)
              echo "::error::the line count is not a number: '$LINES'"
              echo "::error::the budget check would have been vacuous"
              exit 1
              ;;
          esac
          echo "qqqai --help: $LINES lines (budget 40)"

          # Every command must still be present -- a budget met by printing less
          # than the tool has is not the standard.
          #
          # The list is on ONE line deliberately: an earlier version used a
          # backslash continuation, which mangled the word list and produced
          # `::error::the help omits the  command` with an empty name -- a red
          # build that said nothing about the code.
          PRESENT=0
          for cmd in new build run dev serve test inspect audit verify caps why trace doctor mcp schema migrate; do
            "$BIN" --help | grep -q "^    $cmd " || {
              echo "::error::the help omits the $cmd command"
              exit 1
            }
            PRESENT=$((PRESENT + 1))
          done

          # And the loop itself must have run. Without this, a bug that skipped it
          # would look exactly like every command being present.
          if [ "$PRESENT" -ne 16 ]; then
            echo "::error::expected to check 16 commands, checked $PRESENT"
            exit 1
          fi

          if [ "$LINES" -gt 40 ]; then
            echo "::error::qqqai --help prints $LINES lines, over the 40-line budget"
            exit 1
          fi
          echo "::notice::help is within budget at $LINES lines; $PRESENT commands listed"

      # ARCH-008 / NN-2: prove the forbidden-unsafe invariant actually holds.
      - name: no unsafe without an audited exception
        shell: bash
        run: |
          set -euo pipefail
          # qqq-sys is the only crate permitted to contain unsafe code.
          #
          # The pattern matches the `unsafe` KEYWORD in code positions:
          #   `unsafe {`, `unsafe fn`, `unsafe impl`, `unsafe extern`, `unsafe trait`
          # It deliberately does NOT match the word appearing in prose.
          #
          # An earlier version grepped for the bare word `\bunsafe\b` and failed
          # on a comment reading "which is the unsafe direction". A check that
          # fires on documentation is a check people learn to work around, and
          # the workaround (deleting the word) makes the code less clear.
          violations=$(grep -rnE --include='*.rs' \
            '\bunsafe[[:space:]]*(\{|fn\b|impl\b|extern\b|trait\b)' crates \
            | grep -v '^crates/qqq-sys/' \
            | grep -v 'forbid(unsafe_code)' \
            | grep -v '#!\[cfg_attr' || true)
          if [ -n "$violations" ]; then
            echo "::error::unsafe code found outside crates/qqq-sys:"
            echo "$violations"
            exit 1
          fi
          echo "OK: no unsafe code outside the audited exception crate"

          # And the belt to that braces: every crate except qqq-sys must carry
          # the attribute, so a new crate cannot silently omit it.
          missing=$(for d in crates/*/; do
            name=$(basename "$d")
            [ "$name" = "qqq-sys" ] && continue
            grep -q 'forbid(unsafe_code)' "$d/src/lib.rs" 2>/dev/null || echo "$name"
          done)
          if [ -n "$missing" ]; then
            echo "::error::these crates lack #![forbid(unsafe_code)]:"
            echo "$missing"
            exit 1
          fi
          echo "OK: every crate except qqq-sys forbids unsafe code"

      # SEC-020: the `unsafe` audit, as a scripted and self-testing gate.
      #
      # # Why this replaces an inline grep rather than duplicating it
      #
      # The step above proves the *lint policy* holds. This one proves the
      # *count* is zero, with three properties the inline version lacks:
      #
      #   1. **It separates prose from code.** The inline grep has to be read
      #      carefully to see that it only matches code positions; a script whose
      #      doc comment explains its classification is checkable at a glance.
      #   2. **It reports what it scanned.** "0 findings across 85 files" and
      #      "0 findings" are different claims, and only the first is falsifiable
      #      — a scanner pointed at the wrong directory also finds nothing.
      #   3. **It is one implementation, run identically here and locally.** An
      #      inline shell pipeline only ever runs in CI, which is the failure
      #      `§O-055` records: a check the author never sees fail.
      #
      # It also covers both lint escapes (`allow` and `cfg_attr(..., allow)`),
      # where the inline version exempts anything matching `#![cfg_attr` — a
      # broader exemption than the thing it is guarding against.
      - name: unsafe audit (SEC-020)
        run: python tools/audit_unsafe.py

      # The audit's zero is only evidence if the audit can find a one. This
      # injects all seven `unsafe` forms into a temporary tree and fails if any is
      # missed -- and it checks three PROSE controls too, because a scanner whose
      # only tests are injections happily over-reports, and an audit that cries
      # wolf is one people stop running. It caught exactly that bug during
      # development: a string literal containing `unsafe {` was flagged as code.
      - name: unsafe audit is live (SEC-020)
        run: python tools/audit_unsafe.py --self-test

      # The audit's *numbers* are evidence too, and they are the part nothing checked.
      # `docs/unsafe-audit.md` said 85 files scanned while the tree held 139: true when
      # written, never tied to the tree afterwards, and wrong in the direction that
      # understates the sample. The page's own argument is that "a zero that appears for
      # the wrong reason is worse than a non-zero", and a drifted sample size is that
      # problem in miniature -- the reader cannot tell whether the count was right and the
      # tree grew, or whether the scanner was looking elsewhere all along.
      - name: unsafe audit document matches the tree (SEC-020)
        run: python tools/audit_unsafe.py --check-doc

  # ---------------------------------------------------------------------------
  # MSRV: does the workspace actually build on the version Cargo.toml promises?
  # ---------------------------------------------------------------------------
  #
  # `Cargo.toml` declares `rust-version = "1.97"` and **nothing built with 1.97**,
  # so the claim was unverified in both directions: raising it would go unnoticed,
  # and lowering it (or using a 1.98-only API by accident) could break users with
  # no signal at all. A promise nothing checks is the shape `§O-066` records.
  #
  # Only `check`, not `test`: the MSRV promise is *"this compiles"* — a user on
  # 1.97 does not inherit this project's test suite. `--all-targets` so a
  # test-only construct cannot slip past, and `--locked` so the resolution is the
  # one committed rather than whatever a fresh solve finds today.
  #
  # Linux only: the MSRV is a property of the language version, not of the three
  # platforms, and the matrix would triple the cost of the same answer.
  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    # 30 min, from a measured 0.6 warm, but it builds the whole workspace cold on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # An explicit `toolchain:`, deliberately overriding `rust-toolchain.toml`:
      # this job's whole purpose is to build with something *other* than the
      # pinned version. `msrv-exempt` tells `tools/check_toolchain.py` not to
      # compare this channel against the pin, and the marker must stay adjacent to
      # the input it excuses.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # msrv-exempt
          toolchain: "1.97"
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build every target on the declared MSRV
        run: cargo check --workspace --all-targets --locked

      # Anti-vacuity: `cargo check` exits 0 on an empty workspace, so a job that
      # silently stopped seeing any crates would report success forever. The
      # expected count is measured from the workspace, not written by hand, so
      # adding a crate cannot make it stale -- and the comparison is exact, because
      # a `-lt` threshold would still pass with a crate missing.
      - name: Prove the MSRV job actually examined the workspace
        run: |
          set -eu
          COUNT="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["packages"]))')"
          case "$COUNT" in
            ''|*[!0-9]*) echo "the crate count is not a number: '$COUNT'"; exit 1 ;;
          esac
          # The workspace has 11 members. Asserting the exact number means a crate
          # that stops being picked up -- the failure this guard exists for -- is a
          # failure rather than a smaller success.
          echo "MSRV checked $COUNT crate(s)"
          if [ "$COUNT" -ne 11 ]; then
            echo "expected 11 workspace crates, examined $COUNT"
            echo "if you added or removed a crate, update this number deliberately"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Reference application: `examples/orders-api` (`SRV-018`).
  #
  # # Why this job exists, and why it is separate
  #
  # The guest crate declares its own empty `[workspace]` **deliberately** -- a
  # QQQ app must be compiled by the guest toolchain against the guest's own
  # `wit/`, not as a member of the host workspace (`§O-147`). The cost of that
  # correctness is that `cargo fmt/clippy/test --workspace` cannot see it, so for
  # a long time nothing did.
  #
  # Measured when this job was added: `cargo clippy --all-targets -- -D warnings`
  # in `examples/orders-api` reported **11 errors** -- including two
  # `chunks_exact`-with-constant-chunk-size lints, the exact lint class that
  # caused the three red runs recorded in `§O-121` -- and `cargo fmt -- --check`
  # reported drift in 4 of the 5 source files. Every one of those had been in the
  # tree for an unknown number of commits, in the artifact that `§9.1` measures
  # and `§9.2` sets numeric budgets against.
  #
  # This is the repository's most-recorded defect shape: *a control believed live
  # that is not*. The fix is not "run the workspace commands harder" -- they are
  # working correctly. The fix is a second gate over the artifact they cannot
  # reach.
  #
  # Linux only, for the same reason the MSRV job is: a lint and a formatting
  # answer are properties of the source, not of the host platform, and the
  # three-platform matrix would triple the cost of an identical result.
  # ---------------------------------------------------------------------------
  reference-app:
    name: Reference application (SRV-018)
    runs-on: ubuntu-latest
    # 30 min, from a measured 0.7 on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # The guest has its own `target/`, so the default workspace key would
          # miss it entirely and every run would rebuild from scratch.
          workspaces: "examples/orders-api -> target"

      # Anti-vacuity, and it is the important step in this job.
      #
      # `cargo clippy` exits 0 on a directory that contains no package it can
      # see, so a job that quietly stopped finding the crate would report
      # success forever -- which is precisely the failure mode this job exists to
      # end. The guard asserts the crate is present by name and that it really is
      # outside the host workspace, so an accidental `[workspace]` removal (which
      # would silently move the guest *into* the gate above) is caught here too.
      - name: Prove the crate is present and is not a workspace member
        working-directory: examples/orders-api
        run: |
          set -eu

          # # Why this step uses only `cargo`, `grep` and `test`
          #
          # The first version of this guard piped `cargo metadata` into
          # `python3 -c '...'`. It works on a GitHub runner, where python3 is
          # native -- but it silently couples the step to a second tool, and the
          # local reproduction showed exactly how that fails: this machine's
          # `bash` is WSL, which has python3 but CANNOT SEE cargo, so the
          # pipeline yielded an empty count. The guard then reported a *failed
          # measurement* rather than a failed tree, and only its anti-vacuity
          # clause below turned that into a red build instead of a green one.
          #
          # Everything below needs only tools a Rust runner is guaranteed to
          # have. `--no-deps` emits exactly one object per package, so counting
          # `"name":` occurrences is an exact package count.
          test -f Cargo.toml || { echo "::error::no Cargo.toml in examples/orders-api"; exit 1; }

          META="$(cargo metadata --no-deps --format-version 1)"

          # # Why the count uses `manifest_path` and NOT `"name"`
          #
          # The first version of this guard counted `"name":"..."` occurrences.
          # Measured against the real tree: **3, not 1** -- `--no-deps` emits a
          # `name` for the package AND for each of its targets (the lib target
          # and the generated `wit-bindgen` target). Shipped as written, this
          # guard would have failed on every healthy run: a check aimed at a
          # nearby property that is easy to assert rather than the one that
          # matters.
          #
          # `manifest_path` appears exactly once per package in `--no-deps`
          # output and never in nested data. Measured: 1 occurrence, 1 package.
          COUNT="$(printf '%s' "$META" | grep -o '"manifest_path":"[^"]*"' | wc -l | tr -d ' ')"
          NAME="$(printf '%s' "$META" \
            | grep -o '"packages":\[{"name":"[^"]*"' | cut -d'"' -f6)"
          echo "reference application package: $NAME"
          if [ "$NAME" != "orders-api" ]; then
            echo "::error::expected package 'orders-api', found '$NAME'"
            exit 1
          fi

          # `cargo metadata` run from the guest reports ONLY the guest when the
          # empty [workspace] table is present. More than one package means the
          # guest was absorbed into the host workspace, which would make this job
          # redundant and the build wrong.

          # Anti-vacuity FIRST: an unreadable measurement must not be able to
          # satisfy the comparison below. A non-numeric COUNT would make
          # `[ "$COUNT" -ne 1 ]` fail-open on some shells, and an empty COUNT
          # already did exactly that once while this guard was being built.
          case "$COUNT" in
            ''|*[!0-9]*)
              echo "::error::the package count is not a number: '$COUNT'"
              echo "::error::the guard would have compared against nothing"
              exit 1
              ;;
          esac

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::expected 1 package in the guest workspace, found $COUNT"
            echo "the empty [workspace] table that keeps the guest separate is gone"
            exit 1
          fi

          # The `wit/` tree is what makes it a QQQ application rather than a bare
          # wasm module; `qqqai new` scaffolded one WITHOUT it for a long time.
          test -f wit/app.wit || { echo "::error::wit/app.wit is missing"; exit 1; }
          test -f wit/deps/qqq-http/qqq-http.wit || {
            echo "::error::wit/deps/qqq-http/qqq-http.wit is missing"
            exit 1
          }
          echo "OK: orders-api is present, separate, and carries its WIT tree ($COUNT package)"

      - name: rustfmt
        working-directory: examples/orders-api
        run: cargo fmt -- --check

      # `--locked` on every step that resolves dependencies, because this crate
      # is the *measurement instrument*: without it, two CI runs of the same
      # commit can resolve different dependency versions and therefore measure
      # different code. `Cargo.lock` is committed and tracked (verified), so the
      # flag is enforceable rather than aspirational.
      #
      # `rustfmt` above deliberately does NOT take it -- formatting performs no
      # dependency resolution, so the flag there would be noise, not rigour.
      - name: clippy (warnings are errors)
        working-directory: examples/orders-api
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      # The guest's own tests. `cargo test --workspace` cannot reach them: that is
      # the whole reason this job exists (`§O-147`, and the handbook's note that a
      # green `--workspace` says nothing about the reference application).
      - name: test
        working-directory: examples/orders-api
        run: cargo test --all-features --locked --verbose

      # The point of the app is that it COMPILES TO A COMPONENT. A lint-clean
      # crate that no longer builds for `wasm32-wasip2` would pass every step
      # above, so the guest target is exercised explicitly.
      - name: build for wasm32-wasip2
        working-directory: examples/orders-api
        run: cargo build --release --target wasm32-wasip2 --locked

      - name: Install wasm-tools
        # The same action the WIT job uses, rather than `cargo install`: it is
        # pinned, cached, and -- the part that matters -- it FAILS when the tool
        # cannot be obtained. A `cargo install ... || true` would make the
        # component check below skip silently, which is the vacuity failure this
        # repository records more often than any other.
        uses: taiki-e/install-action@wasm-tools

      - name: Prove the artifact is a real component exporting the HTTP handler
        working-directory: examples/orders-api
        run: |
          set -eu
          WASM="target/wasm32-wasip2/release/orders_api.wasm"
          test -f "$WASM" || { echo "::error::$WASM was not produced"; exit 1; }
          echo "artifact: $WASM ($(wc -c < "$WASM") bytes)"

          WIT="$(wasm-tools component wit "$WASM")"
          echo "$WIT" | grep -q 'export qqq:http/incoming-handler' || {
            echo "::error::the artifact does not export qqq:http/incoming-handler"
            echo "$WIT"
            exit 1
          }
          echo "OK: the artifact is a component exporting the qqq:http handler"

  # ---------------------------------------------------------------------------
  # Supply chain: licences, advisories, unused dependencies.
  # ---------------------------------------------------------------------------
  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    # 25 min, from a measured 0.4 on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # An explicit channel, because `@master` requires one: see the note in the
      # Rust job for why `@stable` was a moving target that cost three red runs
      # (§O-121). Keep this in step with `rust-toolchain.toml`.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      # Both checks are now **required**, not advisory.
      #
      # They previously carried `continue-on-error: true`, with a note that
      # `deny.toml` would land with LIC-007. Without that file cargo-deny fell
      # back to its default allowlist and rejected `Apache-2.0 OR MIT`, so it
      # failed on every run — and a red check that everyone knows is red stops
      # being read. cargo-machete was also finding three real unused
      # dependencies, which are now removed.
      #
      # Removing the escape hatch is the point: an unconditionally-failing check
      # and an unconditionally-passing one carry the same information (`§M-006`).
      - name: cargo-deny (licences + advisories)
        run: cargo deny check

      - name: cargo-machete (unused dependencies)
        run: cargo machete

      # `SEC-028`. The SBOM is produced and **published as a build artifact**, not
      # merely generated and discarded.
      #
      # # Why the distinction is the whole item
      #
      # "Produce an SBOM" is satisfied by a command that writes a file to a runner's
      # ephemeral disk, and that satisfies nothing a consumer needs. An SBOM is only
      # useful to the person asking "am I affected by CVE-X?" if they can *obtain*
      # it — so the job uploads it, and the upload is what makes the step real.
      #
      # # Why CycloneDX
      #
      # It is the format downstream tooling (Dependency-Track, Grype, Trivy, GitHub's
      # dependency graph) already consumes, and it is machine-readable without a
      # licence negotiation. SPDX would be equally defensible; CycloneDX is chosen
      # for the ecosystem fit and recorded here so the choice is a decision rather
      # than a default.
      #
      # # Why the `--spec-version` is pinned
      #
      # An SBOM whose schema version changes between two runs of the same commit is
      # not reproducible, and reproducibility is the property a consumer audits. The
      # version is stated so a bump is a visible change to this file.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@cargo-cyclonedx

      - name: Generate the SBOM (CycloneDX)
        run: |
          cargo cyclonedx \
            --format json \
            --spec-version 1.5 \
            --describe crate \
            --all

      # The files land beside each crate's manifest; gather them so one artifact
      # carries the whole graph rather than N files nobody finds.
      #
      # # Why the exclusion list is explicit
      #
      # `cargo cyclonedx` writes `<crate>.cdx.json` next to each `Cargo.toml`, and
      # the first version of this step used `find crates fuzz` — which also walked
      # `crates/*/target/` on a runner that had built in place, collecting stale
      # files from an earlier target directory. The paths are pruned rather than
      # filtered afterwards so the intent is visible.
      - name: Collect the SBOM files
        run: |
          mkdir -p sbom
          find crates fuzz \
            -name '*.cdx.json' \
            -not -path '*/target/*' \
            -exec cp {} sbom/ \;
          echo "Generated $(ls -1 sbom | wc -l) SBOM file(s):"
          ls -1 sbom

      # **The check that the SBOM is not empty or malformed.**
      #
      # A generation step that emitted a syntactically valid but empty document
      # would pass `cargo cyclonedx` and be worthless — the `§O-085` shape in a
      # supply-chain artifact. This asserts each file parses as JSON and names at
      # least one component, so "the SBOM exists" is a statement about its contents.
      - name: Assert the SBOM is well formed and non-empty
        run: python tools/check_sbom.py sbom

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # The production image: distroless, read-only root, non-root (`SEC-029`).
  #
  # # Why every property is asserted rather than declared
  #
  # "Distroless" and "non-root" are claims about an artifact, and a `Dockerfile` that
  # says `FROM distroless` and `USER 65532` does not prove either. Both can be
  # defeated by an unrelated change -- a base-image tag that starts shipping a shell,
  # a build step that runs as root and leaves a setuid helper -- and the failure is
  # invisible because the image still *works*.
  #
  # So each property is a command whose output is checked, on every commit. That is
  # the difference between a hardened image and an image that claims to be.
  # ---------------------------------------------------------------------------
  production-image:
    name: Production image (SEC-029)
    runs-on: ubuntu-latest
    # 90 min, from a measured 3.5 cached; the bridge is ~46 min uncached on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Build the distroless image
        run: docker build -f docker/Dockerfile.prod -t qqqai:ci .

      # **No shell.** This is the property that removes a whole class of
      # post-exploitation behaviour, and it is asserted by *trying to use one* rather
      # than by reading the base image's name.
      - name: Assert the image has no shell
        run: |
          if docker run --rm --entrypoint /bin/sh qqqai:ci -c 'echo present' 2>/dev/null; then
            echo "FATAL: /bin/sh exists in the production image."
            echo "This removes the property the distroless base was chosen for: an"
            echo "attacker who reaches the process gains a shell, and with it the"
            echo "ability to run further commands."
            exit 1
          fi
          echo "OK: no /bin/sh in the image"

      # **Read-only root.** The image must run with no writable filesystem, which
      # means the process writes nothing outside its data volumes at startup.
      - name: Assert it runs with a read-only root filesystem
        run: |
          docker run --rm --read-only qqqai:ci --help > /dev/null
          echo "OK: the binary runs with --read-only"

      # **Non-root.** Both the declared user and the uid the process actually runs
      # as, because those can differ.
      - name: Assert the process is not root
        run: |
          declared=$(docker inspect qqqai:ci --format '{{.Config.User}}')
          echo "declared user: ${declared}"
          if [ "${declared}" = "root" ] || [ -z "${declared}" ]; then
            echo "FATAL: the image declares no user, which means uid 0."
            exit 1
          fi
          echo "OK: the image declares a non-root user"

      # **The binary works.** A hardened image that cannot run the program is not a
      # deliverable, and every check above would pass on an empty image.
      - name: Assert the CLI actually runs
        run: |
          docker run --rm --read-only qqqai:ci --help | tee /tmp/help.txt
          if ! grep -q 'qqqai' /tmp/help.txt; then
            echo "FATAL: the CLI did not print its help output"
            exit 1
          fi
          echo "OK: the CLI runs under every hardening flag"

      # `LANG-007` / `§5.1`. The Proposal's install section declares four SLOs and says they are
      # *"measured in CI on every commit, not aspirations"* -- and **nothing measured any of them**.
      # This job is the right home for the two that are about size: it builds exactly what a user
      # installs, so the shipped binary is already here and the measurement costs no extra build.
      #
      # # Why the binary is extracted rather than measured through `docker run`
      #
      # Because the runtime stage is **distroless** -- there is no `stat`, no `du` and no shell to
      # run them with. `docker create` + `docker cp` gets the bytes out without needing anything
      # inside the image, which is the same property the job asserts above.
      #
      # # Why only two of the four SLOs are here
      #
      # The other two are **timings**, and this is the wrong instrument for them: measured through
      # `docker run`, `qqqai --version` reads **599.8 ms p50**, which is docker's own container
      # startup and not the binary's. Measured natively it is **7.75 ms p50** against a ≤ 15 ms
      # budget. A wall-clock number taken on a shared runner through a container runtime is not a
      # gate, so the honest thing is to record it where it was measured correctly and to say so in
      # `§5.1` rather than to add a step that measures the wrong thing (`§O-353`).
      - name: Assert the shipped binary meets the §5.1 size budgets (LANG-007)
        run: |
          set -eu

          # The two budgets, as `§5.1` states them. Written as bytes so the comparison is exact.
          FOOTPRINT_BUDGET=$((60 * 1000 * 1000))
          DOWNLOAD_BUDGET=$((25 * 1000 * 1000))

          # The binary, out of the image, without running anything inside it.
          CID="$(docker create qqqai:ci)"
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT
          docker cp "$CID:/usr/local/bin/qqqai" /tmp/qqqai-shipped
          test -s /tmp/qqqai-shipped || { echo "::error::the binary could not be extracted"; exit 1; }

          FOOTPRINT="$(wc -c < /tmp/qqqai-shipped | tr -d ' ')"
          DOWNLOAD="$(gzip -9 -c /tmp/qqqai-shipped | wc -c | tr -d ' ')"

          echo "installed footprint (binary only) : $FOOTPRINT bytes   budget <= $FOOTPRINT_BUDGET"
          echo "download size (gzip -9)           : $DOWNLOAD bytes   budget <= $DOWNLOAD_BUDGET"

          # Anti-vacuity first: a zero-byte binary would satisfy both comparisons below, and the
          # `test -s` above is the only thing that would have caught it.
          case "$FOOTPRINT" in
            ''|*[!0-9]*) echo "::error::the footprint is not a number: '$FOOTPRINT'"; exit 1 ;;
          esac
          case "$DOWNLOAD" in
            ''|*[!0-9]*) echo "::error::the download size is not a number: '$DOWNLOAD'"; exit 1 ;;
          esac

          status=0
          if [ "$FOOTPRINT" -gt "$FOOTPRINT_BUDGET" ]; then
            echo "::error::installed footprint is over the §5.1 budget"
            status=1
          fi
          if [ "$DOWNLOAD" -gt "$DOWNLOAD_BUDGET" ]; then
            echo "::error::download size is over the §5.1 budget"
            status=1
          fi
          [ "$status" -eq 0 ] || exit 1
          echo "OK: the shipped binary is inside both §5.1 size budgets"

  # ---------------------------------------------------------------------------
  # Fuzzing targets: they must still COMPILE.
  #
  # SEC-012/SEC-013. The nightly `Fuzz` workflow runs them; this job proves they
  # still build, on every commit and on stable CI infrastructure.
  #
  # # Why a compile check is worth a job of its own
  #
  # `fuzz/` is a separate workspace, so `cargo build --workspace` at the root does
  # not touch it -- and nothing else does either. That means a signature change in
  # `qqq-cap` or `qqq-host` breaks the fuzz targets **silently**: the nightly job
  # would fail at 03:17, and the distance between the commit that caused it and
  # the failure would be up to a day with several unrelated commits in between.
  #
  # The regression corpus in `crates/*/tests/fuzz_corpus.rs` cannot cover this,
  # because it is deliberately written against the *public* API on stable Rust and
  # does not use `libfuzzer-sys`. So the targets need their own check, and this is
  # it. The cost is a few seconds; the alternative is discovering a broken fuzzing
  # programme a day later, or never.
  # ---------------------------------------------------------------------------
  fuzz-targets:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    # 30 min, from a measured 5.8 on run 36296671757. There was
    # **no `timeout-minutes` anywhere in this workflow**, so a hang burned
    # GitHub's 360-minute default instead of failing fast (`§O-355`).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        #
        # Required for the LINK step below. `cargo +nightly check` does not need it
        # — that is plain cargo — which is why the first version of this job could
        # run `check` and then fail on `cargo fuzz build` with
        # `error: no such command: fuzz` and exit 101.
        #
        # `--locked` so the fuzzing toolchain is reproducible: an unpinned
        # `cargo-fuzz` would be a component of the programme that changes without a
        # commit, and a failure caused by a new release would look like a failure
        # in this repository.
        run: cargo +nightly install cargo-fuzz --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # A separate cache key, because this job builds the `fuzz/` workspace
          # with a different toolchain from every other job.
          workspaces: fuzz

      - name: Every fuzz target compiles
        run: |
          set -euo pipefail
          cd fuzz
          cargo +nightly check --all-targets

      - name: The fuzz targets LINK and produce a runnable binary
        #
        # `check` proves the targets type-check; it proves nothing about whether
        # they can be built into something runnable. A linker failure is a
        # *platform* failure and is exactly the kind that goes unnoticed until the
        # nightly job fails at 03:17 -- which is how this step came to exist: on
        # Windows, `crate-type = ["cdylib", "lib"]` made the link fail with
        # `LNK2001: unresolved external symbol main`, and only an actual build
        # surfaced it.
        run: |
          set -euo pipefail
          cd fuzz
          cargo +nightly fuzz build

      - name: The regression corpus also runs
        # The corpus lives in the main workspace and is already covered by
        # `cargo test --workspace`, but running it here makes this job's evidence
        # self-contained: a reviewer reading the fuzzing job's log sees BOTH
        # halves of the programme, and does not have to trust that the other job
        # ran.
        run: |
          set -euo pipefail
          cargo test -p qqq-cap --test fuzz_corpus
          cargo test -p qqq-host --test fuzz_corpus
