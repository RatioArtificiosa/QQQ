# SPDX-License-Identifier: Apache-2.0
#
# qqq.toml — the secrets probe guest.
#
# A minimal manifest: the probe is instantiated directly by host tests and
# served by GuestApp tests, never deployed alone, so there is no `[server]`
# section. The stanzas below are what those tests grant: the secret under
# test, the crypto operations it exercises, and the HTTP server surface the
# probe's `incoming-handler` export requires.

[package]
name = "probe-secrets"
version = "0.1.0"

[build]
language = "rust"
target = "wasm32-wasip2"
profile = "release"

[capabilities.secret]
secrets = ["env:K"]

[capabilities.crypto]
sign = ["ed25519"]
hmac = ["sha256"]
aead = ["aes-256-gcm"]

[capabilities.http]
server = true
