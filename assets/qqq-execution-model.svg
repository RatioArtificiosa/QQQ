      <line x1="1200" y1="315" x2="1200" y2="355"/><line x1="1200" y1="395" x2="1200" y2="435"/>
    </g>
    <line x1="800" y1="40" x2="800" y2="660" stroke="#1E293B" stroke-width="2"/>
    <text x="800" y="640" fill="#94A3B8" font-size="24">QQQ starts from a different execution boundary</text>
