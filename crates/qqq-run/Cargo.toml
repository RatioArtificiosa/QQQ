[package]
name = "qqq-run"
description = "The qqqai CLI: new, build, run, dev, serve, test, inspect, audit, why, doctor, schema and mcp. Every command emits stable machine-readable JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "cli", "runtime", "wasm"]
categories = ["wasm", "command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "qqqai"
path = "src/main.rs"

[dependencies]
qqq-core = { path = "../qqq-core", version = "0.0.0" }
qqq-cap = { path = "../qqq-cap", version = "0.0.0" }
qqq-pkg = { path = "../qqq-pkg", version = "0.0.0" }
qqq-host = { path = "../qqq-host", version = "0.0.0" }
qqq-abi = { path = "../qqq-abi", version = "0.0.0" }
# The edge that makes `[server]` reachable.
#
# `qqq-cap` models the manifest's route table and `qqq-serve` owns the router, and
# neither may depend on the other: in §4.3's topological order `qqq-cap` sits above
# `qqq-serve`, so an edge in either direction points upward and
# `tools/check_topology.py` rejects it. `qqq-run` is above both, which makes it the
# only place in this workspace where a manifest can be turned into a router -- and the
# right place, because converting intent into a running server is orchestration.
qqq-serve = { path = "../qqq-serve", version = "0.0.0" }
# The transport primitives `qqqai serve` binds with: `ListenAddr` and `Shutdown`.
#
# `qqq-serve` does not re-export them, so the CLI needs its own edge. The direction
# is legal: `qqq-io` is position 4 in §4.3's order and `qqq-run` is position 7, so
# the edge points downward.
qqq-io = { path = "../qqq-io", version = "0.0.0" }
serde = { workspace = true }
serde_json = { workspace = true }
wasmtime = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
