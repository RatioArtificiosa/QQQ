    <line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="500" x2="1600" y2="500"/><line x1="0" y1="600" x2="1600" y2="600"/>
  </g>
  <g font-size="26" text-anchor="middle">
    <text x="400" y="60" fill="#94A3B8">NODE / BUN</text>
    <text x="1200" y="60" fill="#0077FF">QQQ</text>
    <g fill="#F5F7FA">
      <text x="400" y="140">Application</text>
      <text x="400" y="220">Language runtime</text>
      <text x="400" y="300">Process</text>
