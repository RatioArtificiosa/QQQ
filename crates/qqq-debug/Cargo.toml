[package]
name = "qqq-debug"
description = "QQQ debug information: DWARF source mapping for Wasm frames, so a trap names a file and line rather than a bytecode offset."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "dwarf", "debugging", "wasm"]
categories = ["wasm", "development-tools"]

[lints]
workspace = true

[dependencies]
qqq-core = { path = "../qqq-core", version = "0.0.0" }
# The same `gimli` major version Wasmtime 48 already resolves, so adding this
# crate does not pull a second copy of the DWARF stack into the build. A
# different major would duplicate it silently — the kind of dependency growth
# that is invisible until a binary size regression appears.
#
# `addr2line` was declared here and removed: the extraction walks the line
# program directly, so nothing called it. `cargo machete` found it on CI, which
# is exactly what that check is for — an unused dependency is a licence, a
# supply-chain surface and a build cost bought for nothing.
gimli = { version = "0.33", default-features = false, features = ["read"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
