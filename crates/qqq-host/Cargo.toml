[package]
name = "qqq-host"
description = "QQQ execution engine: Wasmtime 48 integration, pooling, AOT cache, fuel/epoch limits, the trap taxonomy, and per-instance linkers built from grants alone."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "wasmtime", "wasm", "sandbox", "runtime"]
categories = ["wasm", "development-tools"]

[lints]
workspace = true

[dependencies]
qqq-core = { path = "../qqq-core", version = "0.0.0" }
qqq-cap = { path = "../qqq-cap", version = "0.0.0" }
qqq-abi = { path = "../qqq-abi", version = "0.0.0" }
wasmtime = { workspace = true }
# The WASI host implementation (`HOST-017`).
#
# # Why this is not optional
#
# A guest built by `cargo build --target wasm32-wasip2` imports fifteen WASI
# interfaces even when its own source never calls one, because `std` for that target
# is implemented over them. Without a `WasiCtx` in the store and a linker
# registration, **no real guest can instantiate** -- measured:
#
#     error[QQQ-6003]: the component could not be instantiated
#       component imports instance `wasi:io/poll@0.2.9`, but a matching
#       implementation was not found in the linker
#
# Before this dependency the only guests that ran were `qqqai new`'s scaffold, whose
# artifact declares an *empty world* and therefore imports nothing.
#
# # Why the version must track Wasmtime exactly
#
# `wasmtime-wasi` is versioned in lockstep with `wasmtime`. A 49 dependency against
# a 48 engine would put two copies of the component model in one build, and they
# would disagree about the canonical ABI. `§D-003` pins the engine to 48; this pin
# follows it, and `tools/check_toolchain.py`'s neighbours keep such pins honest.
wasmtime-wasi = { workspace = true }
# The `AsyncWrite` trait the guest-output sink implements (`§O-183`).
#
# # Why this is a real dependency and not a dev-dependency
#
# `wasmtime-wasi` 48's p2 stdio API has **no synchronous write pipe**: the only sinks
# are `AsyncWrite`-based (`AsyncWriteStream`, `MemoryOutputPipe`, `simplex`), and
# `StdoutStream::async_stream` is declared to return `Box<dyn AsyncWrite + Send +
# Sync>`. Sanitising a guest's output therefore requires implementing `AsyncWrite`,
# which requires `tokio`.
#
# The `unsafe`-free route was checked first: a hand-built `RawWaker` for a synchronous
# poll would have avoided the trait, but the crate-level `forbid(unsafe_code)` rejects
# it and `forbid` cannot be relaxed by an inner `allow`. The synchronous *behaviour* is
# kept — `poll_write` escapes and writes in one step and never returns `Pending` — so
# no executor is needed at runtime despite the async trait.
#
# Tokio was already a workspace dependency and already in `Cargo.lock` through the
# dev-dependency below, so this promotes an existing pin rather than adding a crate.
tokio = { workspace = true, features = ["io-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
blake3 = "1"
getrandom = "0.4"

[dev-dependencies]
serde_json = { workspace = true }
# The async execution path (`HOST-015`, `HOST-016`) is tested against a real
# runtime, because `call_async` and `epoch_deadline_async_yield_and_update` only
# have meaning inside one — a test that drove them without a reactor would be
# asserting the shape of the API rather than that it works. Tokio is already a
# workspace dependency and is in `Cargo.lock`, so this adds no new crate.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
