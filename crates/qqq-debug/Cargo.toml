[package]
name = "qqq-debug"
description = "QQQ debug information: DWARF source mapping for Wasm frames, so a trap names a file and line rather than a bytecode offset."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "dwarf", "debugging", "wasm"]
categories = ["wasm", "development-tools"]

[lints]
workspace = true

[dependencies]
qqq-core = { path = "../qqq-core", version = "0.0.0" }
# The same `gimli`/`addr2line` major versions Wasmtime 48 already resolves, so
# adding this crate does not pull a second copy of the DWARF stack into the
# build. A different major would duplicate it silently — the kind of dependency
# growth that is invisible until a binary size regression appears.
gimli = { version = "0.33", default-features = false, features = ["read"] }
addr2line = { version = "0.26", default-features = false, features = ["rustc-demangle"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
