# The toolchain every build uses.
#
# # Why this file exists
#
# CI pins `stable` (`dtolnay/rust-toolchain@stable`), which is a **moving target**:
# it names whatever `stable` is on the day the job runs. A developer's machine
# pins whatever they last installed. Those two are not the same version, and
# nothing in the repository said so — so `cargo clippy -- -D warnings` could pass
# locally and fail in CI on a lint that one toolchain has and the other does not.
#
# That is exactly what happened: `chunks_exact` with a constant chunk size is a
# lint added in **1.98**, this machine had **1.97.1**, and CI rejected a commit
# that was clean for three local verification passes (§O-121). The code was
# correct; the *verification* was not, because a command is not the whole
# specification — the toolchain version is part of it.
#
# Pinning the version here makes `stable` a value rather than a variable, and
# `rustup` fetches exactly this version for anyone who runs `cargo` in the repo.
# CI reads the same file through `dtolnay/rust-toolchain@master` with no `toolchain:`
# input, so the workflow and the developer agree by construction rather than by
# coincidence.
#
# # Why 1.98 and not the MSRV
#
# `Cargo.toml` declares `rust-version = "1.97"` (the MSRV — the oldest toolchain
# that can build this workspace). This file pins the toolchain the workspace is
# **built and linted** with, which is deliberately newer: clippy gains lints over
# time, and a project that lints with its own MSRV cannot adopt a lint until it
# raises the MSRV. Both numbers are stated, and they differ on purpose — the MSRV
# is a compatibility promise to users, this is a reproducibility promise to
# contributors.
#
# **The MSRV is verified by the `msrv` job in CI**, which builds every target with
# 1.97 and asserts the exact number of crates it examined. It was briefly an
# unverified claim: `rust-version = "1.97"` was stated and nothing built with 1.97,
# so raising it would have gone unnoticed and using a 1.98-only API by accident
# could have broken users with no signal.

[toolchain]
channel = "1.98"
components = ["rustfmt", "clippy"]
targets = ["wasm32-wasip2"]
profile = "minimal"
