[package]
name = "qqq-serve"
description = "QQQ HTTP server: the compile-time route table, the HTTP/1.1 parser and connection state machine, and the accept loop that binds them to a socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "http", "server", "wasm"]
categories = ["wasm", "web-programming::http-server"]

[lints]
# F-18 deny promotion (Wave 6): this crate does NOT inherit
# `workspace.lints` because Cargo forbids mixing `lints.workspace = true`
# with overrides. The table below is the workspace table with the Wave-0
# advisory lints raised to deny. `qqq-serve` is in the security-critical
# set (parsers, limiters, connection state machines) with release
# `overflow-checks` on, so a new `unwrap`/`expect`/subscript/cast here must
# fail the build, not warn. Kept in sync with `[workspace.lints]` in the
# root manifest by hand; `clippy -- -D warnings` proves it on every gate.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(kani)"] }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
redundant_imports = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[dependencies]
qqq-core = { path = "../qqq-core", version = "0.1.1" }
qqq-io = { path = "../qqq-io", version = "0.1.1" }
# For the instance pool: `HOST-012`'s 503 + `Retry-After` is *decided* by the
# host and only *rendered* here. §4.3 places `qqq-host` above `qqq-serve` in the
# topological order, so this edge points downward and
# `tools/check_topology.py` verifies it — but the placement is not arbitrary:
# a server that computed its own saturation estimate would need its own copy of
# the pool's state, which is the duplicated-source-of-truth problem the
# capability registry already exists to avoid.
qqq-host = { path = "../qqq-host", version = "0.1.1" }
rustls.workspace = true
# **Not** `rustls-pemfile`. That crate is unmaintained (`RUSTSEC-2025-0134`,
# archived August 2025) and `cargo deny check advisories` fails on it; PEM
# parsing now lives in `rustls-pki-types` behind the `PemObject` trait, which is
# the same code the old crate wrapped. Nothing else in the workspace used it, so
# the dependency was removed rather than ignored.
# Already a workspace dependency (used for content addressing) and already in
# `Cargo.lock`, so this adds no resolution. Used for the peer-certificate
# SHA-256 fingerprint in `tls::PeerIdentity`, which is the only stable
# identifier a client certificate has — a common name is chosen by the client
# and is not unique across issuers.
sha2.workspace = true
memchr.workspace = true
# WebSocket handshake only (`SRV-009`). See the workspace manifest for why SHA-1 is
# correct there and not a mistake.
sha1.workspace = true
base64.workspace = true
# `sync` is added to the workspace's feature set because the connection ledger is
# shared across connection tasks. Cargo unions features across the graph, so this
# enables it for every crate in the workspace — which is why the reason is
# recorded here rather than left as a bare feature name.
tokio = { workspace = true, features = ["sync"] }
# Hyper 1.x for the Option A serving transport (`F-16`, Wave 8): the server
# side speaks HTTP/1.1 and HTTP/2 through hyper's connection drivers while
# QQQ policy stays in QQQ as middleware. Version 1.12.0, MIT — inside
# deny.toml's allowlist, verified before proposing rather than after adding.
# No separate direct `h2` dependency per the owner's non-negotiables: Hyper
# owns framing, HPACK, stream state, and flow control.
hyper = { version = "1", features = ["server", "http1", "http2"] }
# Timer + IO adapters for the hyper serving path (`F-16`): the `apply_*`
# functions set a `TokioTimer` on each builder, and the tests serve real
# connections through `TokioIo`. Used by non-test code, so this is a main
# dependency, not a dev one.
hyper-util = { version = "0.1", features = ["tokio"] }
# Response bodies for the hyper serve path (`F-16`): the service answers
# with in-memory `Full` bodies, and `Bytes` is the buffer they share with
# the body reader. Both used by non-test code.
http-body-util = "0.1"
# The `Body` trait for the send-stamping wrapper (`F-16`, Wave 8): the
# idle bound must observe response sends, not just answered requests,
# so responses travel in a `Body` impl that stamps the watch on every
# poll. Version 1.1.0, MIT — same license family as hyper, already in
# the lockfile through hyper, declared directly because the impl
# names it. Used by non-test code.
http-body = "1"
bytes = "1"
# TLS termination for the hyper accept path (`F-16` parity, Wave 8):
# `serve_hyper_tls` handshakes with `TlsAcceptor` and routes by
# negotiated ALPN. Promoted from dev-dependencies (where the
# handshake-level tests used it) because production code now
# names it. Version 0.26.5, MIT/Apache-2.0 — inside deny.toml,
# verified by `cargo deny check`.
tokio-rustls = "0.26.5"
# Polling hyper's body stream inside the `AsyncRead` adapter (`F-16`):
# `BodyStream` speaks `futures_core::Stream`, and the adapter is the only
# place that polls it.
futures-core = { version = "0.3", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14.10", features = ["pem"] }
# **Dev only, deliberately.** `access_log` hand-writes its JSON encoder so the
# crate has no serialization dependency on a path that runs per request, and so the
# control-character escaping is explicit rather than inherited. The tests parse the
# output with a real parser, because asserting on substrings cannot prove a document
# is well-formed -- and `render_json`'s whole promise is that it is.
serde_json.workspace = true
