<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
  <rect width="1600" height="700" fill="#05070B"/>
  <g stroke="#111827" stroke-width="1">
