# QQQ Workspace
#
# Status: pre-alpha. This manifest defines the crate topology specified in
# QQQ-Proposal-V1.md §4.3. Most members are not yet implemented; they are
# declared here so that the architecture is enforced by the build system from
# the first commit rather than by convention.

[workspace]
resolver = "2"
members = [
    # Tier: stable — shared types, no I/O.
    # Implements: ARCH-007
    # Proposal: §4.3 Crate topology
    "crates/qqq-core",

    # Tier: stable — the benchmark harness.
    # Implements: PERF-001, PERF-002, PERF-005, PERF-020, PERF-022
    # Proposal: §9.1 The honest benchmark position, §9.2 The performance budget
    #
    # Depends on `serde` and nothing else -- not even `qqq-core`, which the first
    # version declared until `cargo-machete` rejected the unused edge in CI. It
    # defines the *methodology* (a type, not a document) and the *budgets* (data,
    # not a table in prose), and having no internal dependencies is what lets it
    # measure anything without dragging in this project's internals.
    "crates/qqq-bench",

    # Tier: stable — the capability engine. The reason this project exists.
    # Implements: CAP-001 .. CAP-016
    # Proposal: §6.2 qqq-cap — the capability engine
    "crates/qqq-cap",

    # Tier: stable — Wasmtime integration.
    # Implements: HOST-001 .. HOST-024
    # Proposal: §6.1 qqq-host — the execution engine
    "crates/qqq-host",

    # Tier: stable — WIT packages and generated bindings.
    # Implements: ABI-001 .. ABI-016
    # Proposal: §6.3 qqq-abi — WIT interfaces as the single source of truth
    "crates/qqq-abi",

    # Tier: stable — reactor abstraction over Tokio / io_uring.
    # Implements: ARCH-005, PERF-014
    # Proposal: §4.2 Process and thread model
    "crates/qqq-io",

    # Tier: stable — HTTP and application server.
    # Implements: SRV-001 .. SRV-020
    # Proposal: §6.4 qqq-serve — the HTTP and application server
    "crates/qqq-serve",

    # Tier: stable — CLI orchestration: new, build, run, dev, test, deploy.
    # Implements: CLI-001 .. CLI-024, DX-001 .. DX-020
    # Proposal: §5.2 The command surface, §6.6 qqq-run
    "crates/qqq-run",

    # Tier: beta — registry client, solver, lockfile, content-addressed store.
    # Implements: PKG-001 .. PKG-024
    # Proposal: §6.5 qqq-pkg — package manager and registry
    "crates/qqq-pkg",

    # Tier: beta — debugger, DWARF source mapping, replay.
    # Implements: DET-007, DET-008, DX-017
    # Proposal: §10.5 Determinism, §6.6 qqq-run
    "crates/qqq-debug",

    # Tier: exception — requires `unsafe`. See crates/qqq-sys/SAFETY.md.
    # Implements: ARCH-009, SEC-020
    # Proposal: §4.3 Crate topology
    "crates/qqq-sys",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/RatioArtificiosa/QQQ"
homepage = "https://qqq.codes"
documentation = "https://docs.qqq.codes"
authors = ["QQQ Contributors"]
keywords = ["webassembly", "runtime", "wasm", "component-model", "wasmtime"]
categories = ["wasm", "development-tools", "network-programming"]

[workspace.dependencies]
# The execution engine. Pinned deliberately — see Proposal §D-003 and RISK-003.
# Implements: HOST-020, PLAN-012
wasmtime = "48"
# The WASI host implementation, pinned to the SAME major as the engine.
#
# # Why this must track `wasmtime` exactly
#
# `wasmtime-wasi` is released in lockstep with `wasmtime` and links against its
# component model. A 49 `wasmtime-wasi` beside a 48 `wasmtime` would put two copies
# of the component model in one build, and the canonical ABI they agree on *is* the
# wire format a guest is compiled against -- so a mismatch is a silent
# misinterpretation of every value crossing the boundary, not a clean build error.
#
# # Why it is needed at all
#
# A guest built with `cargo build --target wasm32-wasip2` imports fifteen WASI
# interfaces even when its own source never calls one, because `std` for that target
# is implemented over them. Without a host implementation, instantiation fails:
#
#     error[QQQ-6003]: the component could not be instantiated
#       component imports instance `wasi:io/poll@0.2.9`, but a matching
#       implementation was not found in the linker
#
# # Why `default-features = false` with only `p2`
#
# `p1` pulls `wiggle` and the preview-1 file/socket ABI, neither of which QQQ
# exposes. A guest reaches files and sockets through `qqq:fs` and `qqq:http`, which
# are capability-gated; letting WASI's ambient versions in would grant authority the
# capability model does not know about, which is the failure `§4.4` forbids.
wasmtime-wasi = { version = "48", default-features = false, features = ["p2"] }

anyhow = "1"
thiserror = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "time", "io-util", "signal", "macros"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

sha2 = "0.10"
ed25519-dalek = "2"
rustls = "0.23"

# RFC 6455's handshake, and **the one place SHA-1 is correct**.
#
# `Sec-WebSocket-Accept` is `base64(SHA1(client_key ++ GUID))`, where the GUID is a
# fixed constant from the specification. It is not a security control: it proves the
# server read the handshake rather than being a proxy that passed the upgrade through
# blindly. An attacker who can compute SHA-1 gains nothing, because the value is derived
# entirely from a key the client itself chose.
#
# Recorded here because `sha1` next to `sha2` invites the question "why is a broken hash
# in this dependency list?", and the answer needs to be where the dependency is rather
# than in a commit message. `deny.toml` does not flag it: the advisory database has no
# entry for "a protocol mandates this".
sha1 = "0.10"
# Already in the lockfile transitively (rustls brings it), so declaring it directly adds
# no resolution. Used for the same handshake value.
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

# The dev profile is tuned for iteration speed, not runtime speed.
[profile.dev]
opt-level = 1
debug = 1

# Benchmarks must be built with release semantics.
[profile.bench]
inherits = "release"
lto = "fat"

[workspace.lints.rust]
# NN-2 (Proposal §2.2) and ARCH-008: the host must contain no unsafe code.
# An exception crate opts out explicitly, individually, and only with a written
# safety argument (ARCH-009) -- and there is currently NO exception: `qqq-sys` is
# the one exception-tier crate and it contains zero `unsafe` blocks, so every crate
# in this workspace inherits this `forbid` unchanged. The design named three
# exception crates; they were merged into `qqq-sys` (§O-059f). See
# `docs/unsafe-audit.md` for the measured count.
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# These are deliberately allowed project-wide; each is justified.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
