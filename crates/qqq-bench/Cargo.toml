[package]
name = "qqq-bench"
description = "QQQ benchmark harness: the §9.1 methodology as a type, percentile statistics, repetition and variance, and the §9.2 budget contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
keywords = ["qqq", "benchmark", "performance", "methodology"]
categories = ["development-tools"]

[lints]
workspace = true

[dependencies]
# # Why there is no `qqq-core` dependency, though one was declared first
#
# The first version of this manifest declared `qqq-core`, on the reasoning that a
# workspace crate should build on the shared error model. `cargo-machete` rejected
# it in CI: the crate never uses it. Verified locally -- a search for `qqq_core`
# across `src/` returns nothing.
#
# The finding is correct and the fix is to **remove the edge**, not to whitelist
# it. A harness that defines what a measurement is needs no shared error type: its
# failures are `MethodologyError` and `BudgetError`, both of which carry their own
# `§9.1`/`§9.2` citations and implement `std::error::Error` directly. An unused
# declaration is not harmless -- it is a false statement about the dependency
# graph, it slows every build of this crate, and `check_topology.py` would have
# accepted an edge that does not exist.
#
# The consequence is that `qqq-bench` depends only on `serde` and Tokio, so it can
# be used to measure anything, including a future non-QQQ comparison (`PERF-*`)
# without dragging in this project's internals.
serde = { workspace = true }
serde_json = { workspace = true }

# # Why Tokio, and why this is not a new crate in the graph
#
# `PERF-002`'s workloads are driven over a **real socket** (`§O-163`): `§9.2`
# states several budgets "at 10k RPS" against a running server, and none of those
# is observable in-process. A load generator needs asynchronous connection handling
# with a *stated* number of connections in flight, which is exactly what an async
# runtime provides.
#
# Tokio is already a workspace dependency and is already in `Cargo.lock`, so this
# adds no crate to the graph and no risk to the supply chain. `net` is the only
# feature needed beyond what the workspace default carries.
#
# `criterion` was considered and rejected twice -- once in `PERF-001` for measuring
# in-process calls with no concurrency concept, and again here because `§9.1`
# requires the concurrency level be *disclosed per result*, which is a concept
# Criterion does not have.
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# A test needs to run the driver against a listener it controls, so the runtime
# has to be constructible inside a `#[tokio::test]`.
tokio = { workspace = true, features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }

# # Why `wasmtime` is a dev-dependency and NOT a dependency (`PERF-005`)
#
# The comment above explains that `qqq-bench` depends on `serde` and Tokio and
# **nothing else**, "so it can be used to measure anything, including a future
# non-QQQ comparison (`PERF-*`) without dragging in this project's internals".
# That property is worth keeping, and it is kept: this is the `[dev-dependencies]`
# table, so a consumer of the published `qqq-bench` library still gets a crate with
# no engine in it. The benchmark harness that MEASURES components is allowed to
# depend on the engine; the *library* is not.
#
# # Why `qqq-host` is not the dependency instead
#
# `PERF-005` measures the canonical ABI's `lower`/`lift` cost. That cost is
# Wasmtime's, and `qqq-host` sits *above* `qqq-bench` at §4.3 position 5 -- an
# edge from `qqq-bench` (position 1) to `qqq-host` would point **upward** and
# `tools/check_topology.py` plus `crates/qqq-core/tests/architecture.rs`
# (`ARCH-004`) both reject it. Verified, not assumed: both checkers filter on the
# `qqq-` prefix, and both pass with this line present.
#
# The honest consequence is stated in the measurement's own docs: this harness
# drives Wasmtime **directly**, with the minimal component-model configuration,
# and therefore measures the ABI rather than QQQ's configured engine. qqq-host's
# pooling allocator, guard pages and epoch interruption are deliberately outside
# this measurement, because they are `PERF-003`'s subject and not this one.
#
# # Why the version is the workspace pin
#
# `§D-003` pins the engine to 48, and the whole point of the numbers in
# `docs/abi-cost-measured.md` is that they describe the engine QQQ actually uses.
# A floating `wasmtime = "48"` resolves through `Cargo.lock` to the same 48.0.2
# that `qqq-host` compiles against, so the harness and the host cannot drift onto
# different canonical ABIs -- the failure mode the workspace manifest records for
# `wasmtime-wasi`.
wasmtime = { workspace = true }
